name: Build App

on:
  workflow_call:
    inputs:
      app_name:
        description: "Name of the app to build"
        required: true
        type: string
      dockerfile_path:
        description: "Path to the Dockerfile"
        required: true
        type: string
      build_args:
        description: "Build arguments to pass to Docker build"
        required: false
        type: string
        default: ""
    secrets:
      GH_PAT:
        required: true
    outputs:
      image:
        description: "Built image name"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-info.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Prepare build arguments
        id: build-args
        run: |
          BUILD_ARGS=""
          if [ -n "${{ inputs.build_args }}" ]; then
            ***REMOVED*** Process build_args as space-separated arguments
            for arg in ${{ inputs.build_args }}; do
              BUILD_ARGS="${BUILD_ARGS} --build-arg ${arg}"
            done
          fi
          echo "args=${BUILD_ARGS}" >> $GITHUB_OUTPUT

      - name: Set image info
        id: image-info
        run: |
          IMAGE_NAME="${{ github.repository }}/${{ inputs.app_name }}"
          echo "image=ghcr.io/${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          echo "Building image: ghcr.io/${IMAGE_NAME}:latest"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.image-info.outputs.image }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Info
        run: |
          echo "Built and pushed: ${{ steps.image-info.outputs.image }}"
