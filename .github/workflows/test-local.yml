name: SSH Test

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Print secrets
        run: |
          echo "HOST: ${{ secrets.HOST }}"
          echo "USER: ${{ secrets.USER }}"
          echo "KEY: ${{ secrets.KEY }}"

      - name: Test SSH with appleboy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            echo "✅ SSH connection via Appleboy succeeded!"
            hostname
            whoami
