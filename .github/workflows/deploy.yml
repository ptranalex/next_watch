name: Deploy Application

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy_backend:
        description: "Deploy backend API"
        required: false
        type: boolean
        default: false
      deploy_importer:
        description: "Deploy data importer"
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: "Deploy frontend"
        required: false
        type: boolean
        default: false
    secrets:
      DEPLOY_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      GH_PAT:
        required: true
      POSTGRES_USER:
        required: true
      POSTGRES_PASSWORD:
        required: true
      POSTGRES_DB:
        required: true
      JWT_SECRET:
        required: true
      JWT_JWK:
        required: false
      JWT_JWK_ROTATION_INTERVAL:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ -n "$ACT" ]; then
            echo "ACT_RUNNING=true" >> $GITHUB_ENV
            echo "SSH_PATH=/root/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/root/.ssh" >> $GITHUB_ENV
          else
            echo "ACT_RUNNING=false" >> $GITHUB_ENV
            echo "SSH_PATH=/home/runner/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/home/runner/.ssh" >> $GITHUB_ENV
          fi

      - name: Restore SSH key from string
        run: |
          mkdir -p "$SSH_DIR"
          echo "${{ secrets.DEPLOY_KEY }}" | sed 's/\\n/\n/g' > "$SSH_PATH"
          chmod 600 "$SSH_PATH"
          echo "SSH key written to $SSH_PATH with permissions:"
          ls -la "$SSH_PATH"
          echo "SSH key format check:"
          ssh-keygen -l -f "$SSH_PATH" || echo "INVALID SSH KEY FORMAT"

      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ env.SSH_PATH }}
          script: |
            echo "✅ SSH connection successful"
            hostname
            echo "This is a test from GitHub Actions"

      - name: Deploy with docker-compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ env.SSH_PATH }}
          script: |
            set -e
            mkdir -p /home/${{ secrets.DEPLOY_USER }}/next_watch
            cd /home/${{ secrets.DEPLOY_USER }}/next_watch

            echo "🔐 Attempting Docker login to GHCR..."
            if ! echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin; then
              echo "⚠️ Docker login failed — retrying with sudo..."
              echo "${{ secrets.GH_PAT }}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin || {
                echo "❌ Docker login failed even with sudo. Aborting."
                exit 1
              }
            fi

            ***REMOVED*** write .env
            echo "DOCKER_FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:latest" > .env
            echo "DOCKER_BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend-api:latest" >> .env
            echo "DOCKER_IMPORTER_IMAGE=ghcr.io/${{ github.repository }}/data-importer:latest" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env

            ***REMOVED*** Handle JWT configuration
            if [ -n "${{ secrets.JWT_SECRET }}" ]; then
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            fi

            ***REMOVED*** Handle JWK configuration if available
            if [ -n "${{ secrets.JWT_JWK }}" ]; then
              echo "JWT_JWK=${{ secrets.JWT_JWK }}" >> .env
            fi

            ***REMOVED*** Handle JWK rotation if available
            if [ -n "${{ secrets.JWT_JWK_ROTATION_INTERVAL }}" ]; then
              echo "JWT_JWK_ROTATION_INTERVAL=${{ secrets.JWT_JWK_ROTATION_INTERVAL }}" >> .env
            fi

            ***REMOVED*** write docker-compose.prod.yml directly from GitHub
            curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -o docker-compose.prod.yml \
                 https://api.github.com/repos/${{ github.repository }}/contents/infra/docker-compose.prod.yml

            ***REMOVED*** Verify file content
            echo "Verifying docker-compose.prod.yml content:"
            ls -la docker-compose.prod.yml
            head -10 docker-compose.prod.yml

            ***REMOVED*** Build the list of services to deploy
            SERVICES=""
            if [ "${{ inputs.deploy_backend }}" = "true" ]; then
              SERVICES="$SERVICES backend-api"
            fi
            if [ "${{ inputs.deploy_importer }}" = "true" ]; then
              SERVICES="$SERVICES data-importer"
            fi
            if [ "${{ inputs.deploy_frontend }}" = "true" ]; then
              SERVICES="$SERVICES frontend"
            fi

            if [ -n "$SERVICES" ]; then
              echo "Deploying services: $SERVICES"
              
              ***REMOVED*** Cleanup before deployment
              echo "🧹 Cleaning up Docker resources..."
              
              ***REMOVED*** Stop and remove containers that are not running
              docker ps -a -q -f status=exited | xargs -r docker rm
              sudo docker ps -a -q -f status=exited | xargs -r sudo docker rm
              
              ***REMOVED*** Remove unused images
              docker image prune -af
              sudo docker image prune -af
              
              ***REMOVED*** Remove unused volumes
              docker volume prune -f
              sudo docker volume prune -f
              
              ***REMOVED*** Remove unused networks
              docker network prune -f
              sudo docker network prune -f
              
              ***REMOVED*** Pull and deploy only the specified services
              docker compose -f docker-compose.prod.yml pull $SERVICES || sudo docker compose -f docker-compose.prod.yml pull $SERVICES
              docker compose -f docker-compose.prod.yml up -d $SERVICES || sudo docker compose -f docker-compose.prod.yml up -d $SERVICES
              
              ***REMOVED*** Final cleanup after deployment
              echo "🧹 Final cleanup..."
              docker system prune -af --volumes
              sudo docker system prune -af --volumes
            else
              echo "No services to deploy"
            fi
