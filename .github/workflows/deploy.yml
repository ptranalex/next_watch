name: Deploy Application (All Services)

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy backend API"
        required: false
        type: boolean
        default: false
      deploy_auth:
        description: "Deploy auth API"
        required: false
        type: boolean
        default: false
      deploy_bff:
        description: "Deploy BFF API"
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: "Deploy frontend"
        required: false
        type: boolean
        default: false
      deploy_importer:
        description: "Deploy data importer"
        required: false
        type: boolean
        default: false
      deploy_recommendation:
        description: "Deploy recommendation API"
        required: false
        type: boolean
        default: false
      deploy_search:
        description: "Deploy search API"
        required: false
        type: boolean
        default: false
      deploy_ml:
        description: "Deploy ML API"
        required: false
        type: boolean
        default: false
      deploy_observability:
        description: "Deploy Grafana Alloy (Observability)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy_backend:
        description: "Deploy backend API"
        required: false
        type: boolean
        default: false
      deploy_auth:
        description: "Deploy auth API"
        required: false
        type: boolean
        default: false
      deploy_bff:
        description: "Deploy BFF API"
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: "Deploy frontend"
        required: false
        type: boolean
        default: false
      deploy_importer:
        description: "Deploy data importer"
        required: false
        type: boolean
        default: false
      deploy_recommendation:
        description: "Deploy recommendation API"
        required: false
        type: boolean
        default: false
      deploy_search:
        description: "Deploy search API"
        required: false
        type: boolean
        default: false
      deploy_ml:
        description: "Deploy ML API"
        required: false
        type: boolean
        default: false
      deploy_observability:
        description: "Deploy Grafana Alloy (Observability)"
        required: false
        type: boolean
        default: false
    secrets:
      DEPLOY_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      GH_PAT:
        required: false
      POSTGRES_USER:
        required: true
      POSTGRES_PASSWORD:
        required: true
      POSTGRES_DB:
        required: true
      JWT_SECRET:
        required: true
      INTERNAL_API_KEY:
        required: true
      TMDB_ACCESS_TOKEN:
        required: false
      OMDB_API_KEY:
        required: false
      JWT_JWK:
        required: false
      JWT_JWK_ROTATION_INTERVAL:
        required: false
      ADMIN_API_KEY:
        required: false
      ***REMOVED*** Grafana Cloud Observability Secrets
      GRAFANA_CLOUD_METRICS_URL:
        required: false
      GRAFANA_CLOUD_METRICS_USERNAME:
        required: false
      GRAFANA_CLOUD_METRICS_PASSWORD:
        required: false
      GRAFANA_CLOUD_LOGS_URL:
        required: false
      GRAFANA_CLOUD_LOGS_USERNAME:
        required: false
      GRAFANA_CLOUD_LOGS_PASSWORD:
        required: false
      GRAFANA_CLOUD_TRACES_URL:
        required: false
      GRAFANA_CLOUD_TRACES_USERNAME:
        required: false
      GRAFANA_CLOUD_TRACES_PASSWORD:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ -n "$ACT" ]; then
            echo "ACT_RUNNING=true" >> $GITHUB_ENV
            echo "SSH_PATH=/root/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/root/.ssh" >> $GITHUB_ENV
          else
            echo "ACT_RUNNING=false" >> $GITHUB_ENV
            echo "SSH_PATH=/home/runner/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/home/runner/.ssh" >> $GITHUB_ENV
          fi

      - name: Restore SSH key from string
        run: |
          mkdir -p "$SSH_DIR"
          echo "${{ secrets.DEPLOY_KEY }}" | sed 's/\\n/\n/g' > "$SSH_PATH"
          chmod 600 "$SSH_PATH"
          echo "SSH key written to $SSH_PATH with permissions:"
          ls -la "$SSH_PATH"
          echo "SSH key format check:"
          ssh-keygen -l -f "$SSH_PATH" || echo "INVALID SSH KEY FORMAT"

      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ env.SSH_PATH }}
          script: |
            echo "✅ SSH connection successful"
            hostname
            echo "This is a test from GitHub Actions"

      - name: Deploy with docker-compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ env.SSH_PATH }}
          script: |
            set -e
            mkdir -p /home/${{ secrets.DEPLOY_USER }}/next_watch
            cd /home/${{ secrets.DEPLOY_USER }}/next_watch

            echo "🔐 Attempting Docker login to GHCR..."
            if ! echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin; then
              echo "⚠️ Docker login failed — retrying with sudo..."
              echo "${{ github.token }}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin || {
                echo "❌ Docker login failed even with sudo. Aborting."
                exit 1
              }
            fi

            ***REMOVED*** Create comprehensive .env.prod file
            echo "***REMOVED*** Docker Images" > .env.prod
            echo "DOCKER_BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend-api:latest" >> .env.prod
            echo "DOCKER_AUTH_IMAGE=ghcr.io/${{ github.repository }}/auth-api:latest" >> .env.prod
            echo "DOCKER_BFF_IMAGE=ghcr.io/${{ github.repository }}/bff-api:latest" >> .env.prod
            echo "DOCKER_FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:latest" >> .env.prod
            echo "DOCKER_IMPORTER_IMAGE=ghcr.io/${{ github.repository }}/data-importer:latest" >> .env.prod
            echo "DOCKER_RECOMMENDATION_IMAGE=ghcr.io/${{ github.repository }}/recommendation-api:latest" >> .env.prod
            echo "DOCKER_SEARCH_IMAGE=ghcr.io/${{ github.repository }}/search-api:latest" >> .env.prod
            echo "DOCKER_ML_IMAGE=ghcr.io/${{ github.repository }}/ml-api:latest" >> .env.prod

            echo "" >> .env.prod
            echo "***REMOVED*** Database Configuration" >> .env.prod
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.prod
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.prod
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env.prod

            echo "" >> .env.prod
            echo "***REMOVED*** Security Configuration" >> .env.prod
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.prod
            echo "INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}" >> .env.prod

            ***REMOVED*** Handle optional JWT configuration
            if [ -n "${{ secrets.JWT_JWK }}" ]; then
              echo "JWT_JWK=${{ secrets.JWT_JWK }}" >> .env.prod
            fi
            if [ -n "${{ secrets.JWT_JWK_ROTATION_INTERVAL }}" ]; then
              echo "JWT_JWK_ROTATION_INTERVAL=${{ secrets.JWT_JWK_ROTATION_INTERVAL }}" >> .env.prod
            fi

            ***REMOVED*** Handle optional external API keys
            if [ -n "${{ secrets.TMDB_ACCESS_TOKEN }}" ]; then
              echo "TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}" >> .env.prod
            fi
            if [ -n "${{ secrets.OMDB_API_KEY }}" ]; then
              echo "OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}" >> .env.prod
            fi

            ***REMOVED*** Handle optional admin API key for cache warming
            if [ -n "${{ secrets.ADMIN_API_KEY }}" ]; then
              echo "ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}" >> .env.prod
            fi

            ***REMOVED*** Handle optional Grafana Cloud observability credentials
            if [ -n "${{ secrets.GRAFANA_CLOUD_METRICS_URL }}" ]; then
              echo "" >> .env.prod
              echo "***REMOVED*** Grafana Cloud Observability" >> .env.prod
              echo "GRAFANA_CLOUD_METRICS_URL=${{ secrets.GRAFANA_CLOUD_METRICS_URL }}" >> .env.prod
              echo "GRAFANA_CLOUD_METRICS_USERNAME=${{ secrets.GRAFANA_CLOUD_METRICS_USERNAME }}" >> .env.prod
              echo "GRAFANA_CLOUD_METRICS_PASSWORD=${{ secrets.GRAFANA_CLOUD_METRICS_PASSWORD }}" >> .env.prod
              echo "GRAFANA_CLOUD_LOGS_URL=${{ secrets.GRAFANA_CLOUD_LOGS_URL }}" >> .env.prod
              echo "GRAFANA_CLOUD_LOGS_USERNAME=${{ secrets.GRAFANA_CLOUD_LOGS_USERNAME }}" >> .env.prod
              echo "GRAFANA_CLOUD_LOGS_PASSWORD=${{ secrets.GRAFANA_CLOUD_LOGS_PASSWORD }}" >> .env.prod
              echo "GRAFANA_CLOUD_TRACES_URL=${{ secrets.GRAFANA_CLOUD_TRACES_URL }}" >> .env.prod
              echo "GRAFANA_CLOUD_TRACES_USERNAME=${{ secrets.GRAFANA_CLOUD_TRACES_USERNAME }}" >> .env.prod
              echo "GRAFANA_CLOUD_TRACES_PASSWORD=${{ secrets.GRAFANA_CLOUD_TRACES_PASSWORD }}" >> .env.prod
              echo "ENVIRONMENT=production" >> .env.prod
            fi

            ***REMOVED*** Download docker-compose.prod.yml from the correct path
            curl -H "Authorization: token ${{ github.token }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -o docker-compose.prod.yml \
                 https://api.github.com/repos/${{ github.repository }}/contents/infra/docker-compose.prod.yml

            ***REMOVED*** Verify file content
            echo "Verifying docker-compose.prod.yml content:"
            ls -la docker-compose.prod.yml
            head -10 docker-compose.prod.yml

            ***REMOVED*** Download Grafana Alloy configuration if observability deployment is requested
            if [ "${{ github.event.inputs.deploy_observability || inputs.deploy_observability }}" = "true" ]; then
              echo "📊 Downloading Grafana Alloy configuration..."
              mkdir -p monitoring/alloy
              
              ***REMOVED*** Download Alloy config file
              curl -H "Authorization: token ${{ github.token }}" \
                   -H "Accept: application/vnd.github.v3.raw" \
                   -o monitoring/alloy/config.alloy \
                   https://api.github.com/repos/${{ github.repository }}/contents/infra/monitoring/alloy/config.alloy
                   
              echo "✅ Grafana Alloy configuration downloaded"
              ls -la monitoring/alloy/
            fi

            ***REMOVED*** Build the list of services to deploy
            SERVICES=""
            if [ "${{ github.event.inputs.deploy_backend || inputs.deploy_backend }}" = "true" ]; then
              SERVICES="$SERVICES backend-api"
            fi
            if [ "${{ github.event.inputs.deploy_auth || inputs.deploy_auth }}" = "true" ]; then
              SERVICES="$SERVICES auth-api"
            fi
            if [ "${{ github.event.inputs.deploy_bff || inputs.deploy_bff }}" = "true" ]; then
              SERVICES="$SERVICES bff-api"
            fi
            if [ "${{ github.event.inputs.deploy_frontend || inputs.deploy_frontend }}" = "true" ]; then
              SERVICES="$SERVICES frontend"
            fi
            if [ "${{ github.event.inputs.deploy_importer || inputs.deploy_importer }}" = "true" ]; then
              SERVICES="$SERVICES data-importer"
            fi
            if [ "${{ github.event.inputs.deploy_recommendation || inputs.deploy_recommendation }}" = "true" ]; then
              SERVICES="$SERVICES recommendation-api"
            fi
            if [ "${{ github.event.inputs.deploy_search || inputs.deploy_search }}" = "true" ]; then
              SERVICES="$SERVICES search-api"
            fi
            if [ "${{ github.event.inputs.deploy_ml || inputs.deploy_ml }}" = "true" ]; then
              SERVICES="$SERVICES ml-api"
            fi
            if [ "${{ github.event.inputs.deploy_observability || inputs.deploy_observability }}" = "true" ]; then
              SERVICES="$SERVICES grafana-alloy"
            fi

            if [ -n "$SERVICES" ]; then
              echo "Deploying services: $SERVICES"
              
              ***REMOVED*** Cleanup before deployment
              echo "🧹 Cleaning up Docker resources..."
              
              ***REMOVED*** Stop and remove containers that are not running
              docker ps -a -q -f status=exited | xargs -r docker rm || true
              sudo docker ps -a -q -f status=exited | xargs -r sudo docker rm || true
              
              ***REMOVED*** Remove unused images
              docker image prune -af || true
              sudo docker image prune -af || true
              
              ***REMOVED*** Remove unused volumes
              docker volume prune -f || true
              sudo docker volume prune -f || true
              
              ***REMOVED*** Remove unused networks
              docker network prune -f || true
              sudo docker network prune -f || true
              
              ***REMOVED*** Pull and deploy only the specified services
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose -f docker-compose.prod.yml --env-file .env.prod pull $SERVICES || \
                sudo docker-compose -f docker-compose.prod.yml --env-file .env.prod pull $SERVICES
                
                docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d $SERVICES || \
                sudo docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d $SERVICES
              else
                ***REMOVED*** Use docker compose (newer syntax)
                docker compose -f docker-compose.prod.yml --env-file .env.prod pull $SERVICES || \
                sudo docker compose -f docker-compose.prod.yml --env-file .env.prod pull $SERVICES
                
                docker compose -f docker-compose.prod.yml --env-file .env.prod up -d $SERVICES || \
                sudo docker compose -f docker-compose.prod.yml --env-file .env.prod up -d $SERVICES
              fi
              
              ***REMOVED*** Wait for services to be healthy
              echo "⏳ Waiting for services to be healthy..."
              sleep 30
              
              ***REMOVED*** Check service status
              echo "📊 Service status:"
              docker ps || sudo docker ps
              
              ***REMOVED*** Final cleanup after deployment
              echo "🧹 Final cleanup..."
              docker system prune -af --volumes || true
              sudo docker system prune -af --volumes || true
            else
              echo "No services to deploy"
            fi
