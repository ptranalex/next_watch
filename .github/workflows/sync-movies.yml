name: Sync Movies

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (inclusive)"
        required: true
        type: number
      end_year:
        description: "End year (inclusive)"
        required: true
        type: number
      limit:
        description: "Maximum movies per year"
        required: false
        type: number
        default: 0
      credits:
        description: "Include cast and crew information"
        required: false
        type: boolean
        default: false
      save:
        description: "Save movies to database"
        required: false
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ -n "$ACT" ]; then
            echo "ACT_RUNNING=true" >> $GITHUB_ENV
            echo "SSH_PATH=/root/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/root/.ssh" >> $GITHUB_ENV
          else
            echo "ACT_RUNNING=false" >> $GITHUB_ENV
            echo "SSH_PATH=/home/runner/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/home/runner/.ssh" >> $GITHUB_ENV
          fi

      - name: Restore SSH key from string
        run: |
          mkdir -p "$SSH_DIR"
          echo "${{ secrets.DEPLOY_KEY }}" | sed 's/\\n/\n/g' > "$SSH_PATH"
          chmod 600 "$SSH_PATH"
          echo "SSH key written to $SSH_PATH with permissions:"
          ls -la "$SSH_PATH"
          echo "SSH key format check:"
          ssh-keygen -l -f "$SSH_PATH" || echo "INVALID SSH KEY FORMAT"

      - name: Run data importer
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ env.SSH_PATH }}
          script: |
            set -e
            cd /home/${{ secrets.DEPLOY_USER }}/next_watch

            ***REMOVED*** write .env for docker compose
            echo "DOCKER_IMPORTER_IMAGE=ghcr.io/${{ github.repository }}/data-importer:latest" > .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}" >> .env
            echo "OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}" >> .env



            ***REMOVED*** write docker-compose.prod.yml directly from GitHub
            curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -o docker-compose.prod.yml \
                 https://api.github.com/repos/${{ github.repository }}/contents/infra/docker-compose.prod.yml

            ***REMOVED*** Build command with options
            CMD="docker compose -f docker-compose.prod.yml --profile sync run --rm data-importer \
                 python -m data_importer sync movies \
                 --start-year ${{ github.event.inputs.start_year }} \
                 --end-year ${{ github.event.inputs.end_year }}"

            ***REMOVED*** Add optional parameters
            if [ "${{ github.event.inputs.limit }}" != "0" ]; then
              CMD="$CMD --limit ${{ github.event.inputs.limit }}"
            fi

            if [ "${{ github.event.inputs.credits }}" = "true" ]; then
              CMD="$CMD --credits"
            fi

            if [ "${{ github.event.inputs.save }}" = "true" ]; then
              CMD="$CMD --save"
            fi

            ***REMOVED*** Execute command
            echo "Running command: $CMD"
            eval $CMD

            ***REMOVED*** Cleanup after sync
            echo "🧹 Cleaning up..."
            docker system prune -af --volumes
            sudo docker system prune -af --volumes
