name: Sync Movies

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (inclusive)"
        required: true
        type: number
        default: 2020
      end_year:
        description: "End year (inclusive)"
        required: true
        type: number
        default: 2025
      limit:
        description: "Maximum movies per year"
        required: false
        type: number
        default: 100
      credits:
        description: "Include cast and crew information"
        required: false
        type: boolean
        default: true
      save:
        description: "Save movies to database"
        required: false
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ -n "$ACT" ]; then
            echo "ACT_RUNNING=true" >> $GITHUB_ENV
            echo "SSH_PATH=/root/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/root/.ssh" >> $GITHUB_ENV
          else
            echo "ACT_RUNNING=false" >> $GITHUB_ENV
            echo "SSH_PATH=/home/runner/.ssh/id_rsa" >> $GITHUB_ENV
            echo "SSH_DIR=/home/runner/.ssh" >> $GITHUB_ENV
          fi

      - name: Restore SSH key from string
        run: |
          mkdir -p "$SSH_DIR"
          echo "${{ secrets.DEPLOY_KEY }}" | sed 's/\\n/\n/g' > "$SSH_PATH"
          chmod 600 "$SSH_PATH"
          echo "SSH key written to $SSH_PATH with permissions:"
          ls -la "$SSH_PATH"
          echo "SSH key format check:"
          ssh-keygen -l -f "$SSH_PATH" || echo "INVALID SSH KEY FORMAT"

      - name: Run data importer
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ env.SSH_PATH }}
          script: |
            set -e
            cd /home/${{ secrets.DEPLOY_USER }}/next_watch

            # Docker login
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pull the latest image
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${REPO_NAME}-data-importer:latest"
            docker pull $IMAGE

            # Run the data importer
            echo "🚀 Running movie sync for years ${{ github.event.inputs.start_year }}-${{ github.event.inputs.end_year }}"

            # Build the command as a single string without line breaks
            CMD="docker run --rm --memory=512m --cpus=0.75"
            CMD="${CMD} -e POSTGRES_HOST=host.docker.internal"
            CMD="${CMD} -e POSTGRES_PORT=5432"
            CMD="${CMD} -e POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            CMD="${CMD} -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            CMD="${CMD} -e POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
            CMD="${CMD} -e DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@host.docker.internal:5432/${{ secrets.POSTGRES_DB }}"
            CMD="${CMD} -e TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}"
            CMD="${CMD} -e OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}"
            CMD="${CMD} --add-host=host.docker.internal:host-gateway"
            CMD="${CMD} ${IMAGE}"
            CMD="${CMD} sync movies"
            CMD="${CMD} --start-year ${{ github.event.inputs.start_year }}"
            CMD="${CMD} --end-year ${{ github.event.inputs.end_year }}"

            # Add optional parameters
            if [ "${{ github.event.inputs.limit }}" != "0" ]; then
              CMD="${CMD} --limit ${{ github.event.inputs.limit }}"
            fi

            if [ "${{ github.event.inputs.credits }}" = "true" ]; then
              CMD="${CMD} --credits"
            fi

            if [ "${{ github.event.inputs.save }}" = "true" ]; then
              CMD="${CMD} --save"
            fi

            # Execute command
            echo "Running command: $CMD"
            eval "$CMD"

            # Cleanup old images
            docker image prune -f
