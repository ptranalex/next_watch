name: Build Application

on:
  workflow_dispatch:
    inputs:
      skip_registry:
        description: "Skip registry sync"
        required: false
        default: "false"
  workflow_call:
    inputs:
      skip_registry:
        description: "Skip registry sync"
        required: false
        type: string
        default: "false"
    secrets:
      GH_PAT:
        required: true
    outputs:
      image_backend:
        description: "Backend API image"
        value: ${{ jobs.build.outputs.image_backend }}
      image_importer:
        description: "Data Importer image"
        value: ${{ jobs.build.outputs.image_importer }}
      image_frontend:
        description: "Frontend image"
        value: ${{ jobs.build.outputs.image_frontend }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_backend: ghcr.io/${{ github.repository }}/backend-api:latest
      image_importer: ghcr.io/${{ github.repository }}/data-importer:latest
      image_frontend: ghcr.io/${{ github.repository }}/frontend:latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            network=host

      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build Backend API
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/backend-api/Dockerfile
          push: ${{ github.event.inputs.skip_registry != 'true' }}
          load: ${{ github.event.inputs.skip_registry == 'true' }}
          tags: ghcr.io/${{ github.repository }}/backend-api:latest
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          network: host

      - name: Build Data Importer
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/data-importer/Dockerfile
          push: ${{ github.event.inputs.skip_registry != 'true' }}
          load: ${{ github.event.inputs.skip_registry == 'true' }}
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/data-importer:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          network: host

      - name: Build Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/web-nextjs/Dockerfile
          push: ${{ github.event.inputs.skip_registry != 'true' }}
          load: ${{ github.event.inputs.skip_registry == 'true' }}
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://alexsandbox.me
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          network: host
