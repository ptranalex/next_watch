name: Build Application (All Services)

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build all apps regardless of changes"
        required: false
        default: "false"
  workflow_call:
    inputs:
      build_all:
        description: "Build all apps regardless of changes"
        required: false
        type: string
        default: "false"
    secrets:
      GH_PAT:
        required: true
    outputs:
      image_backend:
        description: "Backend API image"
        value: ${{ jobs.build_backend.outputs.image }}
      image_auth:
        description: "Auth API image"
        value: ${{ jobs.build_auth.outputs.image }}
      image_bff:
        description: "BFF API image"
        value: ${{ jobs.build_bff.outputs.image }}
      image_frontend:
        description: "Frontend image"
        value: ${{ jobs.build_frontend.outputs.image }}
      image_importer:
        description: "Data Importer image"
        value: ${{ jobs.build_importer.outputs.image }}
      image_recommendation:
        description: "Recommendation API image"
        value: ${{ jobs.build_recommendation.outputs.image }}
      image_search:
        description: "Search API image"
        value: ${{ jobs.build_search.outputs.image }}
      image_ml:
        description: "ML API image"
        value: ${{ jobs.build_ml.outputs.image }}

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      auth_changed: ${{ steps.filter.outputs.auth }}
      bff_changed: ${{ steps.filter.outputs.bff }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      importer_changed: ${{ steps.filter.outputs.importer }}
      recommendation_changed: ${{ steps.filter.outputs.recommendation }}
      search_changed: ${{ steps.filter.outputs.search }}
      ml_changed: ${{ steps.filter.outputs.ml }}
      shared_changed: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend-api/**'
              - 'libs/movie-storage/**'
            auth:
              - 'apps/auth-api/**'
              - 'libs/movie-storage/**'
            bff:
              - 'apps/bff-api/**'
            frontend:
              - 'apps/web-nextjs/**'
            importer:
              - 'apps/data-importer/**'
              - 'libs/movie-storage/**'
            recommendation:
              - 'apps/recommendation-api/**'
              - 'libs/movie-storage/**'
            search:
              - 'apps/search-api/**'
            ml:
              - 'apps/ml-api/**'
            shared:
              - 'libs/movie-storage/**'
              - 'infra/**'

  build_backend:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.backend_changed == 'true' || needs.check_changes.outputs.shared_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: backend-api
      dockerfile_path: ./apps/backend-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_auth:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.auth_changed == 'true' || needs.check_changes.outputs.shared_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: auth-api
      dockerfile_path: ./apps/auth-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_bff:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.bff_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: bff-api
      dockerfile_path: ./apps/bff-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_frontend:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.frontend_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: frontend
      dockerfile_path: ./apps/web-nextjs/Dockerfile
      build_args: |
        NEXT_PUBLIC_API_URL=https://alexsandbox.me
        NEXT_PUBLIC_BFF_API_URL=https://alexsandbox.me
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_importer:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.importer_changed == 'true' || needs.check_changes.outputs.shared_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: data-importer
      dockerfile_path: ./apps/data-importer/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_recommendation:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.recommendation_changed == 'true' || needs.check_changes.outputs.shared_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: recommendation-api
      dockerfile_path: ./apps/recommendation-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_search:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.search_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: search-api
      dockerfile_path: ./apps/search-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_ml:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.ml_changed == 'true' || github.event.inputs.build_all == 'true' }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: ml-api
      dockerfile_path: ./apps/ml-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
