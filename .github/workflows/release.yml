name: Release Application (All Services)

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches: [main]
    paths:
      - "apps/backend-api/**"
      - "apps/auth-api/**"
      - "apps/bff-api/**"
      - "apps/web-nextjs/**"
      - "apps/data-importer/**"
      - "apps/recommendation-api/**"
      - "apps/search-api/**"
      - "apps/ml-api/**"
      - "infra/**"
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build and deploy all apps regardless of changes"
        required: false
        type: boolean
        default: false
      deploy_backend:
        description: "Deploy backend API"
        required: false
        type: boolean
        default: false
      deploy_auth:
        description: "Deploy auth API"
        required: false
        type: boolean
        default: false
      deploy_bff:
        description: "Deploy BFF API"
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: "Deploy frontend"
        required: false
        type: boolean
        default: false
      deploy_importer:
        description: "Deploy data importer"
        required: false
        type: boolean
        default: false
      deploy_recommendation:
        description: "Deploy recommendation API"
        required: false
        type: boolean
        default: false
      deploy_search:
        description: "Deploy search API"
        required: false
        type: boolean
        default: false
      deploy_ml:
        description: "Deploy ML API"
        required: false
        type: boolean
        default: false

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.set-outputs.outputs.backend_changed }}
      auth_changed: ${{ steps.set-outputs.outputs.auth_changed }}
      bff_changed: ${{ steps.set-outputs.outputs.bff_changed }}
      frontend_changed: ${{ steps.set-outputs.outputs.frontend_changed }}
      importer_changed: ${{ steps.set-outputs.outputs.importer_changed }}
      recommendation_changed: ${{ steps.set-outputs.outputs.recommendation_changed }}
      search_changed: ${{ steps.set-outputs.outputs.search_changed }}
      ml_changed: ${{ steps.set-outputs.outputs.ml_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend-api/**'

            auth:
              - 'apps/auth-api/**'

            bff:
              - 'apps/bff-api/**'
            frontend:
              - 'apps/web-nextjs/**'
            importer:
              - 'apps/data-importer/**'
            recommendation:
              - 'apps/recommendation-api/**'
            search:
              - 'apps/search-api/**'
            ml:
              - 'apps/ml-api/**'

      - name: Set outputs
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "backend_changed=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "auth_changed=${{ steps.filter.outputs.auth }}" >> $GITHUB_OUTPUT
            echo "bff_changed=${{ steps.filter.outputs.bff }}" >> $GITHUB_OUTPUT
            echo "frontend_changed=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
            echo "importer_changed=${{ steps.filter.outputs.importer }}" >> $GITHUB_OUTPUT
            echo "recommendation_changed=${{ steps.filter.outputs.recommendation }}" >> $GITHUB_OUTPUT
            echo "search_changed=${{ steps.filter.outputs.search }}" >> $GITHUB_OUTPUT
            echo "ml_changed=${{ steps.filter.outputs.ml }}" >> $GITHUB_OUTPUT
          else
            echo "backend_changed=${{ github.event.inputs.deploy_backend }}" >> $GITHUB_OUTPUT
            echo "auth_changed=${{ github.event.inputs.deploy_auth }}" >> $GITHUB_OUTPUT
            echo "bff_changed=${{ github.event.inputs.deploy_bff }}" >> $GITHUB_OUTPUT
            echo "frontend_changed=${{ github.event.inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
            echo "importer_changed=${{ github.event.inputs.deploy_importer }}" >> $GITHUB_OUTPUT
            echo "recommendation_changed=${{ github.event.inputs.deploy_recommendation }}" >> $GITHUB_OUTPUT
            echo "search_changed=${{ github.event.inputs.deploy_search }}" >> $GITHUB_OUTPUT
            echo "ml_changed=${{ github.event.inputs.deploy_ml }}" >> $GITHUB_OUTPUT
          fi

  build_backend:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.backend_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: backend-api
      dockerfile_path: ./apps/backend-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_auth:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.auth_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: auth-api
      dockerfile_path: ./apps/auth-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_bff:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.bff_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: bff-api
      dockerfile_path: ./apps/bff-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_frontend:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.frontend_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: frontend
      dockerfile_path: ./apps/web-nextjs/Dockerfile
      build_args: NEXT_PUBLIC_API_URL=https://alexsandbox.me
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_importer:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.importer_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: data-importer
      dockerfile_path: ./apps/data-importer/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_recommendation:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.recommendation_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: recommendation-api
      dockerfile_path: ./apps/recommendation-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_search:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.search_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: search-api
      dockerfile_path: ./apps/search-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build_ml:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.ml_changed == 'true' || github.event.inputs.build_all == true }}
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: ml-api
      dockerfile_path: ./apps/ml-api/Dockerfile
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  ***REMOVED*** Preparation job for deployment
  prepare-deployment:
    needs:
      [
        check_changes,
        build_backend,
        build_auth,
        build_bff,
        build_frontend,
        build_importer,
        build_recommendation,
        build_search,
        build_ml,
      ]
    if: |
      always() &&
      (needs.check_changes.outputs.backend_changed == 'true' ||
       needs.check_changes.outputs.auth_changed == 'true' ||
       needs.check_changes.outputs.bff_changed == 'true' ||
       needs.check_changes.outputs.frontend_changed == 'true' ||
       needs.check_changes.outputs.importer_changed == 'true' ||
       needs.check_changes.outputs.recommendation_changed == 'true' ||
       needs.check_changes.outputs.search_changed == 'true' ||
       needs.check_changes.outputs.ml_changed == 'true' ||
       github.event.inputs.build_all == true)
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: false
      deploy_bff: false
      deploy_frontend: false
      deploy_importer: false
      deploy_recommendation: false
      deploy_search: false
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  ***REMOVED*** Individual service deployments
  deploy-backend:
    needs: [check_changes, build_backend, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.backend_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: true
      deploy_auth: false
      deploy_bff: false
      deploy_frontend: false
      deploy_importer: false
      deploy_recommendation: false
      deploy_search: false
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  deploy-auth:
    needs: [check_changes, build_auth, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.auth_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: true
      deploy_bff: false
      deploy_frontend: false
      deploy_importer: false
      deploy_recommendation: false
      deploy_search: false
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  deploy-bff:
    needs: [check_changes, build_bff, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.bff_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: false
      deploy_bff: true
      deploy_frontend: false
      deploy_importer: false
      deploy_recommendation: false
      deploy_search: false
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  deploy-frontend:
    needs: [check_changes, build_frontend, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.frontend_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: false
      deploy_bff: false
      deploy_frontend: true
      deploy_importer: false
      deploy_recommendation: false
      deploy_search: false
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  deploy-importer:
    needs: [check_changes, build_importer, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.importer_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: false
      deploy_bff: false
      deploy_frontend: false
      deploy_importer: true
      deploy_recommendation: false
      deploy_search: false
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  deploy-recommendation:
    needs: [check_changes, build_recommendation, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.recommendation_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: false
      deploy_bff: false
      deploy_frontend: false
      deploy_importer: false
      deploy_recommendation: true
      deploy_search: false
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  deploy-search:
    needs: [check_changes, build_search, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.search_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: false
      deploy_bff: false
      deploy_frontend: false
      deploy_importer: false
      deploy_recommendation: false
      deploy_search: true
      deploy_ml: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}

  deploy-ml:
    needs: [check_changes, build_ml, prepare-deployment]
    if: ${{ always() && needs.prepare-deployment.result == 'success' && (needs.check_changes.outputs.ml_changed == 'true' || github.event.inputs.build_all == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_backend: false
      deploy_auth: false
      deploy_bff: false
      deploy_frontend: false
      deploy_importer: false
      deploy_recommendation: false
      deploy_search: false
      deploy_ml: true
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      JWT_JWK: ${{ secrets.JWT_JWK }}
      JWT_JWK_ROTATION_INTERVAL: ${{ secrets.JWT_JWK_ROTATION_INTERVAL }}
