name: Build App (Self-Hosted - ML Only)

on:
  workflow_call:
    inputs:
      app_name:
        description: "Name of the app to build"
        required: true
        type: string
      dockerfile_path:
        description: "Path to the Dockerfile"
        required: true
        type: string
      build_args:
        description: "Build arguments to pass to Docker build"
        required: false
        type: string
        default: ""
      platforms:
        description: "Target platforms for multi-arch builds"
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Whether to push the image"
        required: false
        type: boolean
        default: true
    secrets:
      GH_PAT:
        required: false
    outputs:
      image:
        description: "Built image name"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}
      metadata:
        description: "Build metadata"
        value: ${{ jobs.build.outputs.metadata }}

jobs:
  build:
    runs-on: [self-hosted, nextwatch]
    permissions:
      contents: read
      packages: write
      id-token: write ***REMOVED*** For cosign signing
    env:
      ***REMOVED*** Expose optional PAT to expressions (some linters disallow `secrets.*` in step `if:`)
      ***REMOVED*** Secrets are still masked in logs.
      GH_PAT: ${{ secrets.GH_PAT }}
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.meta.outputs.json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 ***REMOVED*** Full history for better caching

      - name: Create cache directory
        run: |
          sudo mkdir -p /tmp/buildkit-cache/${{ inputs.app_name }}
          sudo chown -R $(whoami):$(whoami) /tmp/buildkit-cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.12.5
          buildkitd-flags: --allow-insecure-entitlement=network.host

      ***REMOVED*** NOTE:
      ***REMOVED*** If GH_PAT exists but is expired/invalid, preferring it will hard-fail the build.
      ***REMOVED*** We therefore prefer the workflow GITHUB_TOKEN first, and only fall back to GH_PAT
      ***REMOVED*** when that login fails.
      - name: Login to GitHub Container Registry (GITHUB_TOKEN)
        id: login_github_token
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      ***REMOVED*** If the package namespace isn't writable by GITHUB_TOKEN (common with existing GHCR
      ***REMOVED*** packages created outside Actions / with custom permissions), a PAT is required.
      ***REMOVED*** We therefore *also* attempt a PAT login when available; if it fails we keep the
      ***REMOVED*** GITHUB_TOKEN credentials.
      - name: Login to GitHub Container Registry (GH_PAT, if provided)
        if: env.GH_PAT != ''
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.app_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}
          labels: |
            org.opencontainers.image.title=${{ inputs.app_name }}
            org.opencontainers.image.description=NextWatch ${{ inputs.app_name }} service
            org.opencontainers.image.vendor=NextWatch
            maintainer=${{ github.actor }}

      - name: Prepare build arguments
        id: build-args
        shell: bash
        run: |
          echo "Processing build arguments..."

          ***REMOVED*** Clean up input args
          CLEANED_ARGS=$(echo "${{ inputs.build_args }}" | tr -d '\r')

          ***REMOVED*** Add automatic build args
          BUILD_ARGS="$CLEANED_ARGS"
          BUILD_ARGS="$BUILD_ARGS"$'\n'"BUILDKIT_INLINE_CACHE=1"
          BUILD_ARGS="$BUILD_ARGS"$'\n'"BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_ARGS="$BUILD_ARGS"$'\n'"BUILD_VERSION=${{ github.sha }}"
          BUILD_ARGS="$BUILD_ARGS"$'\n'"BUILD_BRANCH=${{ github.ref_name }}"

          ***REMOVED*** Output for debugging
          echo "Final build args:"
          echo "$BUILD_ARGS"

          ***REMOVED*** Set output using heredoc
          {
            echo "args<<EOF"
            echo "$BUILD_ARGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.args }}
          ***REMOVED*** Self-hosted runner optimized caching strategy
          cache-from: |
            type=local,src=/tmp/buildkit-cache/${{ inputs.app_name }}
            type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.app_name }}:cache
          cache-to: |
            type=local,dest=/tmp/buildkit-cache/${{ inputs.app_name }},mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.app_name }}:cache,mode=max
          ***REMOVED*** Build optimizations
          provenance: mode=max
          sbom: true

      ***REMOVED*** - name: Install Cosign
      ***REMOVED***   if: inputs.push == true
      ***REMOVED***   uses: sigstore/cosign-installer@v3

      ***REMOVED*** - name: Sign container image
      ***REMOVED***   if: inputs.push == true
      ***REMOVED***   env:
      ***REMOVED***     DIGEST: ${{ steps.build.outputs.digest }}
      ***REMOVED***     TAGS: ${{ steps.meta.outputs.tags }}
      ***REMOVED***   run: |
      ***REMOVED***     echo "Signing image..."
      ***REMOVED***     echo "$TAGS" | xargs -I {} cosign sign --yes {}@$DIGEST

      ***REMOVED*** - name: Verify and sign SBOM
      ***REMOVED***   if: inputs.push == true
      ***REMOVED***   env:
      ***REMOVED***     DIGEST: ${{ steps.build.outputs.digest }}
      ***REMOVED***     TAGS: ${{ steps.meta.outputs.tags }}
      ***REMOVED***   run: |
      ***REMOVED***     echo "SBOM already generated by Docker buildx (sbom: true)"
      ***REMOVED***     echo "The SBOM is automatically attached to the image during build"
      ***REMOVED***     echo "Image signed and SBOM embedded successfully"

      ***REMOVED***     ***REMOVED*** Optional: You can view the SBOM with:
      ***REMOVED***     ***REMOVED*** docker buildx imagetools inspect --format '{{json .SBOM}}' <image>@<digest>

      - name: Output build summary
        run: |
          echo "***REMOVED******REMOVED*** 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App**: ${{ inputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms**: ${{ inputs.platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pushed**: ${{ inputs.push }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "***REMOVED******REMOVED******REMOVED*** 📋 Build Metadata" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.json }}' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
