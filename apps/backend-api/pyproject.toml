[tool.poetry]
name = "backend-api"
version = "0.1.0"
description = "FastAPI backend for next_watch movie platform"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "backend_api", from = "src"}]
include = ["src/backend_api/py.typed"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
pydantic = "^2.4.2"
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
movie-storage = {path = "../../libs/movie-storage"}
typer = "^0.15.2"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
black = "^23.10.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
backend-api = "backend_api.cli.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 