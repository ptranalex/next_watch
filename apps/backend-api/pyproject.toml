[tool.poetry]
name = "backend-api"
version = "0.1.0"
description = "FastAPI backend for next_watch movie platform"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "backend_api", from = "src"}]
include = ["src/backend_api/py.typed"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
pydantic = "^2.4.2"
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
typer = "^0.15.2"
python-dotenv = "^1.0.0"
movie-storage = {path = "../../libs/movie-storage"}
redis = "^6.0.0"
types-redis = "^4.6.0.20241004"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
email-validator = "^2.1.0"
bcrypt = "3.2.2"
python-dateutil = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.10.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
backend-api = "backend_api.cli.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 