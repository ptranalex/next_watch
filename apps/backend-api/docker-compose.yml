version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://alex:postgres@db:5432/next_watch
    depends_on:
      - db
    volumes:
      - ./:/app
    command: uvicorn backend_api.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=alex
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=next_watch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
