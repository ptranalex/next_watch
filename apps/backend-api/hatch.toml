[env]
requires = ["hatch-vcs"]

[env.paths]
***REMOVED*** Configure module paths
src = "src"
tests = "tests"

[build]
***REMOVED*** Use hatch-vcs for versioning
dev-mode-exact = true

[version]
source = "vcs"

[build.targets.wheel]
packages = ["backend_api"]
exclude = [
  "tests",
  "docs",
  ".github",
  ".vscode",
]

[build.sources]
"src" = ""

[envs.default]
***REMOVED*** Configure virtual environment to be in project directory
type = "virtual"
path = ".venv"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.23.2",
  "pydantic>=2.4.2",
  "sqlalchemy>=2.0.23",
  "sqlmodel>=0.0.8",
  "alembic>=1.12.1",
  "typer>=0.15.2",
  "python-dotenv>=1.0.0",
  "rich>=14.0.0",
  "redis>=6.0.0",
  "types-redis>=4.6.0.20241004",
  "pyjwt>=2.8.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==3.2.2",
  "python-multipart>=0.0.6",
  "email-validator>=2.1.0",
  "python-dateutil>=2.9.0",
  "psycopg2-binary>=2.9.10",
]

***REMOVED*** Add environment variables for development
[envs.default.env-vars]
PYTHONPATH = "src"

[envs.default.scripts]
***REMOVED*** Server management
serve = "python -m backend_api.main"
dev = "PYTHONPATH=src uvicorn backend_api.main:app --reload --port 8000"

***REMOVED*** CLI access
cli = "python -m backend_api.cli"

***REMOVED*** Database management
migrate = "python -m backend_api.cli db migrate"
db-init = "python -m backend_api.cli db init"
db-init-tables = "python -m backend_api.cli db init --create-tables"
db-downgrade = "python -m backend_api.cli db downgrade"
db-teardown = "python -m backend_api.cli db teardown --confirm"

***REMOVED*** Health checks
health = "python -m backend_api.cli health"
health-check = "python -m backend_api.cli health check"
health-redis = "python -m backend_api.cli health redis"
health-db = "python -m backend_api.cli health db"

***REMOVED*** Cache management
cache-info = "python -m backend_api.cli cache info"
cache-keys = "python -m backend_api.cli cache keys"
cache-get = "python -m backend_api.cli cache get"
cache-clear = "python -m backend_api.cli cache clear --confirm"

***REMOVED*** System commands
config = "python -m backend_api.cli config"
version = "python -m backend_api.cli version"
serve-cli = "python -m backend_api.cli serve"

[envs.dev]
dependencies = [
  "pytest>=7.4.3",
  "black>=23.10.1",
  "isort>=5.12.0",
  "flake8>=6.1.0",
  "mypy>=1.7.0",
]

[envs.dev.scripts]
lint = [
  "black .",
  "isort .",
  "flake8 .",
  "mypy src"
]
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=backend_api tests/"
format = [
  "black .",
  "isort ."
] 