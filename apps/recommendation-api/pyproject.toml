[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "recommendation_api"
version = "0.1.0"
description = "Recommendation API for Next Watch platform"
readme = {text = "***REMOVED*** Recommendation API\n\nRecommendation API for Next Watch platform", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    {name = "Alex Tran", email = "p.tran.alex@gmail.com"}
]
maintainers = [
    {name = "Alex Tran", email = "p.tran.alex@gmail.com"}
]
keywords = [
    "api",
    "recommendation",
    "ml",
    "nextwatch",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
requires-python = ">=3.12"
dependencies = [
    ***REMOVED*** Core API framework
    "fastapi>=0.104.0",         ***REMOVED*** API framework
    "uvicorn>=0.23.2",          ***REMOVED*** ASGI server
    "pydantic>=2.4.2",          ***REMOVED*** Data validation
    "pydantic-settings>=2.0.0", ***REMOVED*** Settings management
    
    ***REMOVED*** Database
    "sqlalchemy>=2.0.23",       ***REMOVED*** SQL ORM
    "sqlmodel>=0.0.8",          ***REMOVED*** SQL Model extension
    "psycopg2-binary>=2.9.10",  ***REMOVED*** PostgreSQL driver
    "alembic>=1.13.1",          ***REMOVED*** Database migrations
    "asyncpg>=0.29.0",          ***REMOVED*** Async PostgreSQL driver
    
    ***REMOVED*** Vector database
    "qdrant-client>=1.1.1",     ***REMOVED*** Vector database client
    
    ***REMOVED*** Cache and storage
    "redis>=6.0.0",             ***REMOVED*** Redis client for caching
    "types-redis>=4.6.0",       ***REMOVED*** Redis type stubs
    
    ***REMOVED*** HTTP client for ML API and Backend API
    "httpx>=0.24.0",            ***REMOVED*** Async HTTP client
    "tenacity>=8.2.3",          ***REMOVED*** Retry logic for HTTP requests
    
    ***REMOVED*** CLI and utilities
    "typer>=0.15.2",            ***REMOVED*** CLI framework
    "rich>=13.7.0",             ***REMOVED*** Terminal formatting
    "python-dotenv>=1.0.0",     ***REMOVED*** Environment variable loading
    
    ***REMOVED*** Date/time handling
    "python-dateutil>=2.9.0",   ***REMOVED*** Date utilities
    
    ***REMOVED*** Form handling
    "python-multipart>=0.0.20", ***REMOVED*** Multipart form parsing
    "email-validator>=2.2.0",   ***REMOVED*** Email validation
]

[project.optional-dependencies]
dev = [
    ***REMOVED*** Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    
    ***REMOVED*** Code quality
    "black>=23.10.1",
    "isort>=5.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    
    ***REMOVED*** Local NextWatch libraries (for development)
    ***REMOVED*** "cache @ file:../../libs/cache",
    ***REMOVED*** "cli @ file:../../libs/cli",
    ***REMOVED*** "movie-storage @ file:../../libs/movie-storage",
]

[project.scripts]
rec-api = "recommendation_api.cli.main:main"

[project.urls]
Homepage = "https://github.com/nextwatch/recommendation-api"
Repository = "https://github.com/nextwatch/recommendation-api"
Issues = "https://github.com/nextwatch/recommendation-api/issues"
Documentation = "https://docs.nextwatch.dev/recommendation-api"

***REMOVED*** Hatch configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/recommendation_api"]

[tool.hatch.build.targets.sdist]
packages = ["src/recommendation_api"]

[tool.hatch.build.sources]
"src" = ""

***REMOVED*** Single consolidated environment
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]

***REMOVED*** Install local libraries, so it can be reloaded after changes
install-libs = [
  "pip install -e ../../libs/cache",
  "pip install -e ../../libs/cli",
  "pip install -e ../../libs/movie-storage",
  "pip install -e ../../libs/config",
  "pip install -e ../../libs/fast-core"
]

***REMOVED*** Server management
serve = "python -m recommendation_api.main"
dev = "PYTHONPATH=src uvicorn recommendation_api.main:app --reload --port 8002"

***REMOVED*** CLI access
cli = "python -m recommendation_api.cli"

***REMOVED*** Database management
migrate = "python -m recommendation_api.cli db migrate"
db-init = "python -m recommendation_api.cli db init"
db-init-tables = "python -m recommendation_api.cli db init --create-tables"
db-downgrade = "python -m recommendation_api.cli db downgrade"
db-teardown = "python -m recommendation_api.cli db teardown --confirm"

***REMOVED*** Health checks
health-check = "python -m recommendation_api.cli health check"
health-db = "python -m recommendation_api.cli health db"
health-cache = "python -m recommendation_api.cli health cache"
health-vector = "python -m recommendation_api.cli health vector"

***REMOVED*** Cache management
cache-info = "python -m recommendation_api.cli cache info"
cache-keys = "python -m recommendation_api.cli cache keys"
cache-get = "python -m recommendation_api.cli cache get"
cache-clear = "python -m recommendation_api.cli cache clear --confirm"

***REMOVED*** ML/Vector operations
vector-index = "python -m recommendation_api.cli vector index"
vector-search = "python -m recommendation_api.cli vector search"
model-train = "python -m recommendation_api.cli model train"
model-status = "python -m recommendation_api.cli model status"

***REMOVED*** System commands
config = "python -m recommendation_api.cli config"
version = "python -m recommendation_api.cli version"
serve-cli = "python -m recommendation_api.cli serve"

***REMOVED*** Development tools
lint = [
    "black .",
    "isort .",
    "ruff check .",
    "mypy src"
]
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=recommendation_api tests/"
format = [
    "black .",
    "isort ."
]

***REMOVED*** Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
***REMOVED*** Strict settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = true
disallow_untyped_calls = true
disallow_any_generics = true 
disallow_subclassing_any = true

***REMOVED*** Warning settings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

***REMOVED*** Error reporting
pretty = true
show_column_numbers = true
show_error_context = true

***REMOVED*** Importing
ignore_missing_imports = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "sqlalchemy.*",
    "sqlmodel.*",
    "alembic.*",
    "psycopg2.*",
    "asyncpg.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "typer.*",
    "rich.*",
    "redis.*",
    "httpx.*",
    "tenacity.*",
    "dateutil.*",
    "email_validator.*"
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   ***REMOVED*** pycodestyle errors
    "W",   ***REMOVED*** pycodestyle warnings
    "F",   ***REMOVED*** pyflakes
    "UP",  ***REMOVED*** pyupgrade
    "B",   ***REMOVED*** flake8-bugbear
    "SIM", ***REMOVED*** flake8-simplify
    "I",   ***REMOVED*** isort
]
ignore = [
    "E501", ***REMOVED*** line too long, handled by black
    "B008", ***REMOVED*** do not perform function calls in argument defaults
]