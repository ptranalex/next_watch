[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recommendation_api"
version = "0.1.0"
description = "Recommendation API for Next Watch platform"
authors = [
    {name = "Next Watch Team"}
]
readme = {text = "***REMOVED*** Recommendation API\n\nRecommendation API for Next Watch platform", content-type = "text/markdown"}
requires-python = ">=3.9,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    ***REMOVED*** Core API framework
    "fastapi>=0.100.0",         ***REMOVED*** API framework
    "uvicorn>=0.22.0",          ***REMOVED*** ASGI server
    "pydantic>=2.0.0",          ***REMOVED*** Data validation
    "pydantic-settings>=2.0.0", ***REMOVED*** Settings management
    
    ***REMOVED*** Database
    "sqlalchemy>=2.0.0",        ***REMOVED*** SQL ORM
    "sqlmodel>=0.0.8",          ***REMOVED*** SQL Model extension
    "psycopg2-binary>=2.9.5",   ***REMOVED*** PostgreSQL driver
    "alembic>=1.10.0",          ***REMOVED*** Database migrations
    "asyncpg>=0.27.0",          ***REMOVED*** Async PostgreSQL driver
    
    ***REMOVED*** Vector database
    "qdrant-client>=1.1.1",     ***REMOVED*** Vector database client
    
    ***REMOVED*** Cache and storage
    "redis>=5.0.0",             ***REMOVED*** Redis client for caching
    
    ***REMOVED*** HTTP client for ML API
    "httpx>=0.24.0",            ***REMOVED*** Async HTTP client
    
    ***REMOVED*** CLI and utilities
    "typer>=0.9.0",             ***REMOVED*** CLI framework
    "rich>=13.0.0",             ***REMOVED*** Terminal formatting
    "python-dotenv>=1.0.0",     ***REMOVED*** Environment variable loading
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.0.250",
]

[project.scripts]
rec-api = "recommendation_api.cli.main:app"

***REMOVED*** Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
***REMOVED*** Common strict settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = true
disallow_untyped_calls = true

***REMOVED*** Variable annotation settings
disallow_any_generics = true 
disallow_subclassing_any = true

***REMOVED*** Warning settings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

***REMOVED*** Error reporting
pretty = true
show_column_numbers = true
show_error_context = true

***REMOVED*** Importing
ignore_missing_imports = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*", 
    "sqlmodel.*",
    "pydantic.*",
    "fastapi.*",
    "uvicorn.*",
    "typer.*",
    "rich.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "redis.*",
    "httpx.*",
    "alembic.*",
    "asyncpg.*"
]
ignore_missing_imports = true