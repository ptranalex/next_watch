[tool.poetry]
name = "recommendation-api"
version = "0.1.0"
description = "AI-powered movie recommendation service for Next Watch"
authors = ["Next Watch Team"]
readme = "README.md"
packages = [{include = "recommendation_api", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
sqlalchemy = "^2.0.23"
pydantic = "^2.4.2"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
typer = "^0.15.2"
rich = "^14.0.0"
httpx = "^0.26.0"
sentence-transformers = "^2.2.2"
qdrant-client = "^1.7.0"
redis = "^6.0.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.12.1"

***REMOVED*** Shared library dependency
movie-storage = {path = "../../libs/movie-storage"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
black = "^23.10.1"
isort = "^5.12.0"
mypy = "^1.7.0"
pre-commit = "^3.6.0"

[tool.poetry.scripts]
recommendation-api = "recommendation_api.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --cov=recommendation_api --cov-report=term-missing"

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "sentence_transformers.*",
    "sklearn.*",
]
ignore_missing_imports = true