[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "ml_api"
version = "0.1.0"
description = "Machine Learning API for Next Watch platform"
readme = {text = "# ML API\n\nMachine Learning API for Next Watch platform", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    {name = "Next Watch Team"}
]
maintainers = [
    {name = "Next Watch Team"}
]
keywords = [
    "api",
    "ml",
    "machine-learning",
    "embeddings",
    "nextwatch",
    "transformers",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
requires-python = ">=3.12"
dependencies = [
    # Core API framework
    "fastapi>=0.104.0",         # API framework
    "uvicorn>=0.23.2",          # ASGI server
    "pydantic>=2.4.2",          # Data validation

    # ML functionality - this pulls in torch, transformers, etc.
    "sentence-transformers>=2.2.2",  # Core embedding functionality

    # CLI and utilities
    "typer>=0.15.2",            # CLI framework
    "rich>=13.7.0",             # Terminal formatting
    "structlog>=23.2.0",        # Structured logging
    "python-dotenv>=1.0.0",     # Environment variable loading

    # Date/time handling
    "python-dateutil>=2.9.0",   # Date utilities

    # Form handling
    "python-multipart>=0.0.20", # Multipart form parsing
    "email-validator>=2.2.0",   # Email validation
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",

    # Code quality
    "black>=23.10.1",
    "isort>=5.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",

    # Local NextWatch libraries (for development)
    # "config @ file:../../libs/config",
    # "cli @ file:../../libs/cli",
    # "fast-core @ file:../../libs/fast-core",
]

[project.scripts]
ml-api = "ml_api.cli.main:main"

[project.urls]
Homepage = "https://github.com/nextwatch/ml-api"
Repository = "https://github.com/nextwatch/ml-api"
Issues = "https://github.com/nextwatch/ml-api/issues"
Documentation = "https://docs.nextwatch.dev/ml-api"

# Hatch configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/ml_api"]

[tool.hatch.build.targets.sdist]
packages = ["src/ml_api"]

[tool.hatch.build.sources]
"src" = ""

# Single consolidated environment
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]

# Install local libraries, so they can be reloaded after changes
install-libs = [
  "pip install -e ../../libs/config",
  "pip install -e ../../libs/cli",
  "pip install -e ../../libs/fast-core",
]

# Server management
serve = "python -m ml_api.main"
dev = "PYTHONPATH=src uvicorn ml_api.main:create_app --factory --reload --port 8004"


# CLI access
cli = "python -m ml_api.cli"

# Health checks
health-check = "python -m ml_api.cli health check"
health-model = "python -m ml_api.cli health model"

# Model management
model-info = "python -m ml_api.cli model info"
model-load = "python -m ml_api.cli model load"
model-test = "python -m ml_api.cli model test"

# System commands
config = "python -m ml_api.cli config"
version = "python -m ml_api.cli version"
serve-cli = "python -m ml_api.cli serve"

# Development tools
lint = [
    "black .",
    "isort .",
    "ruff check .",
    "mypy src"
]
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=ml_api tests/"
format = [
    "black .",
    "isort ."
]

# Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
# Strict settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true

# Warning settings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

# Error reporting
pretty = true
show_column_numbers = true
show_error_context = true

# Importing
ignore_missing_imports = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "httpx.*",
    "typer.*",
    "rich.*",
    "sentence_transformers.*",
    "dateutil.*",
    "email_validator.*",
    "structlog.*"
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "SIM", "ARG", "PIE", "PL", "RUF"]
ignore = ["E203", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["ml_api"]
known-third-party = ["cache", "cli", "config", "fast_core", "kafka", "movie_storage"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["PLR2004"]
# Pydantic v1 validators intentionally take `cls` as the first arg; Ruff's N805 doesn't recognize the decorator.
"apps/ml-api/src/ml_api/config/app.py" = ["N805"]
