[env]
requires = ["hatch-vcs"]

[env.paths]
***REMOVED*** Configure module paths
src = "ml_api"
tests = "tests"

[build]
***REMOVED*** Use hatch-vcs for versioning
dev-mode-exact = true

[version]
source = "vcs"

[dirs]
***REMOVED*** Exclude certain directories from packaging
exclude = [
  "tests",
  "docs",
  ".github",
  ".vscode",
]

[build.targets.wheel]
packages = ["ml_api"]

[envs.default]
***REMOVED*** Configure virtual environment to be in project directory
type = "virtual"
path = ".venv"
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "pydantic>=2.0.0",
  "sentence-transformers>=2.2.2",
  "typer>=0.9.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
]

[envs.default.scripts]
serve = "python -m ml_api.app"
dev = "uvicorn ml_api.app:app --reload --port 8004"

[envs.dev]
dependencies = [
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.24.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
  "ruff>=0.0.250",
]

[envs.dev.scripts]
lint = [
  "black .",
  "isort .",
  "ruff check .",
  "mypy ml_api"
]
test = "pytest {args:tests}"
test-cov = "pytest --cov=ml_api tests/"
format = [
  "black .",
  "isort ."
] 