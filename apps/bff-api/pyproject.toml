[tool.poetry]
name = "bff-api"
version = "0.1.0"
description = "Backend for Frontend API - Aggregation layer for next_watch UI"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "bff_api", from = "src"}]
include = ["src/bff_api/py.typed"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
pydantic = "^2.4.2"
httpx = "^0.23.0"
typer = "^0.15.2"
rich = "^13.7.0"
python-dotenv = "^1.0.0"
redis = "^6.0.0"
types-redis = "^4.6.0.20241004"
pyjwt = "^2.8.0"
python-dateutil = "^2.9.0"
tenacity = "^8.2.3"
email-validator = "^2.2.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-httpx = "^0.21.3"
black = "^23.10.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
respx = "^0.20.2"

[tool.poetry.scripts]
bff-api = "bff_api.cli.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 