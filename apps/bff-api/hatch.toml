[env]
requires = ["hatch-vcs"]

[env.paths]
***REMOVED*** Configure module paths
src = "src"
tests = "tests"

[build]
***REMOVED*** Use hatch-vcs for versioning
dev-mode-exact = true

[version]
source = "vcs"

[dirs]
***REMOVED*** Exclude certain directories from packaging
exclude = [
  "tests",
  "docs",
  ".github",
  ".vscode",
]

[build.targets.wheel]
packages = ["bff_api"]

[build.sources]
"src" = ""

[envs.default]
***REMOVED*** Configure virtual environment to be in project directory
type = "virtual"
path = ".venv"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.23.2",
  "pydantic>=2.4.2",
  "httpx>=0.23.0",
  "typer>=0.15.2",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
  "redis>=6.0.0",
  "types-redis>=4.6.0",
  "pyjwt>=2.8.0",
  "python-dateutil>=2.9.0",
  "tenacity>=8.2.3",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.20",
]

***REMOVED*** Add environment variables for development
[envs.default.env-vars]
PYTHONPATH = "src"

[envs.default.scripts]
serve = "python -m bff_api.cli.main serve"
dev = "PYTHONPATH=src uvicorn bff_api.main:app --reload --port 8001 --host 0.0.0.0"
cli = "python -m bff_api.cli.main"

[envs.dev]
dependencies = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
  "pytest-httpx>=0.21.3",
  "black>=23.10.1",
  "isort>=5.12.0",
  "flake8>=6.1.0",
  "mypy>=1.7.0",
  "respx>=0.20.2",
]

[envs.dev.scripts]
lint = [
  "black .",
  "isort .",
  "flake8 .",
  "mypy src"
]
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=bff_api tests/"
format = [
  "black .",
  "isort ."
] 