[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data_importer"
version = "0.1.0"
description = "Data importer for next_watch movie platform"
authors = [
    {name = "Alex Tran", email = "alex@alextran.io"}
]
readme = {text = "# Data Importer\n\nData importer for Next Watch movie platform", content-type = "text/markdown"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core dependencies
    "requests>=2.31.0",          # HTTP client
    "pydantic>=2.4.2",           # Data validation
    "python-dotenv>=1.0.0",      # Environment variable loading

    # CLI and utilities
    "click>=8.1.7",              # CLI framework (legacy)
    "typer>=0.15.2",             # Modern CLI framework
    "rich>=14.0.0,<15.0.0",      # Terminal formatting
    "ptpython>=3.0.23",          # Enhanced Python REPL

    # Async HTTP
    "aiohttp>=3.8.5",            # Async HTTP client

    # Database
    "sqlmodel>=0.0.24",          # SQL ORM
    "psycopg2-binary>=2.9.10",   # PostgreSQL adapter

    # Security
    "passlib>=1.7.4",            # Password hashing

    # Local dependencies - movie-storage installed separately
    # "movie-storage @ file://../../../libs/movie-storage",  # Local movie storage library
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.10.1",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pyright>=1.1.0",
    # Type stubs for better type checking
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.19",
    "types-redis>=4.6.0",
]

[project.scripts]
data-importer = "data_importer.cli:main"

# Package discovery configuration
[tool.hatch.build.targets.wheel]
packages = ["data_importer"]

[tool.hatch.build.targets.sdist]
packages = ["data_importer"]

# Specify that the package is in the src directory
[tool.hatch.build.sources]
"src" = ""

# Allow direct references for local dependencies
[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501", # line too long, formatter handles this
]

[tool.ruff.lint.isort]
# Pre-commit runs Ruff from the monorepo root; make import grouping deterministic.
known-first-party = ["data_importer"]
known-third-party = ["cache", "cli", "config", "fast_core", "kafka", "movie_storage"]

[tool.mypy]
python_version = "3.12"
# Enhanced strict settings - now that major issues are fixed
disallow_untyped_defs = true         # Now enabled - require type annotations
disallow_incomplete_defs = true      # Now enabled - require complete annotations
check_untyped_defs = true
disallow_untyped_decorators = false  # Temporarily disabled due to complex decorator typing
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = false     # Keep false for external libraries
disallow_untyped_calls = false      # Keep false for gradual migration

# Advanced strictness (selective enablement)
disallow_any_generics = true         # Now enabled - require generic parameters
disallow_subclassing_any = true     # Now enabled - prevent Any subclassing

# Warning settings - match bff-api
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

# Error reporting - enhanced like bff-api
pretty = true
show_column_numbers = true
show_error_context = true
show_error_codes = true              # Added for better debugging

# Importing - more permissive for current state
ignore_missing_imports = true        # Keep true for external libraries
follow_imports = "normal"

# Module-specific overrides for external libraries
[[tool.mypy.overrides]]
module = [
    "requests.*",
    "pydantic.*",
    "click.*",
    "typer.*",
    "rich.*",
    "aiohttp.*",
    "sqlmodel.*",
    "psycopg2.*",
    "passlib.*",
    "movie_storage.*",
    "ptpython.*",
    "dotenv.*"
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist", "data", "logs", ".venv"]
extend-ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Hatch configuration (align with other apps in the monorepo)
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]
typecheck = "pyright -p pyrightconfig.json"
