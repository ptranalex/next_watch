[project]
name = "data-importer"
version = "0.1.0"
description = "Data importer for next_watch movie platform"
authors = [
    {name = "Alex Tran", email = "alex@alextran.io"},
]

[tool.poetry]
name = "data-importer"
version = "0.1.0"
description = "Data importer for next_watch movie platform"
authors = ["Alex Tran <p.tran.alex@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31.0"
pydantic = "^2.4.2"
python-dotenv = "^1.0.0"
click = "^8.1.7"
typer = "^0.9.0"
rich = "^13.6.0"
ptpython = "^3.0.23"
aiohttp = "^3.8.5"
sqlmodel = "^0.0.24"
movie-storage = {path = "../../libs/movie-storage", develop = true}
psycopg2-binary = "^2.9.10"



[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
data-importer = "data_importer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["union-attr", "operator", "arg-type", "attr-defined", "assignment"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=22.3.0"
isort = ">=5.10.1"
mypy = ">=0.950"