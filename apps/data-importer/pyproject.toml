[project]
name = "data-importer"
version = "0.1.0"
description = "Data importer for next_watch movie platform"
authors = ["Alex Tran <p.tran.alex@gmail.com>"]

[tool.poetry]
name = "data-importer"
version = "0.1.0"
description = "Data importer for next_watch movie platform"
authors = ["Alex Tran <p.tran.alex@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31.0"
pydantic = "^2.4.2"
python-dotenv = "^1.0.0"
click = "^8.1.7"
typer = "^0.9.0"
rich = "^13.6.0"
ptpython = "^3.0.23"
aiohttp = "^3.8.5"
movie-schema = { path = "../../libs/movie-schema", develop = true }

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
black = "^23.10.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
data-importer = "data_importer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true