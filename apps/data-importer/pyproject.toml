[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data_importer"
version = "0.1.0"
description = "Data importer for next_watch movie platform"
authors = [
    {name = "Alex Tran", email = "alex@alextran.io"}
]
readme = {text = "***REMOVED*** Data Importer\n\nData importer for Next Watch movie platform", content-type = "text/markdown"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    ***REMOVED*** Core dependencies
    "requests>=2.31.0",          ***REMOVED*** HTTP client
    "pydantic>=2.4.2",           ***REMOVED*** Data validation
    "python-dotenv>=1.0.0",      ***REMOVED*** Environment variable loading
    
    ***REMOVED*** CLI and utilities
    "click>=8.1.7",              ***REMOVED*** CLI framework (legacy)
    "typer>=0.15.2",             ***REMOVED*** Modern CLI framework
    "rich>=14.0.0,<15.0.0",      ***REMOVED*** Terminal formatting
    "ptpython>=3.0.23",          ***REMOVED*** Enhanced Python REPL
    
    ***REMOVED*** Async HTTP
    "aiohttp>=3.8.5",            ***REMOVED*** Async HTTP client
    
    ***REMOVED*** Database
    "sqlmodel>=0.0.24",          ***REMOVED*** SQL ORM
    "psycopg2-binary>=2.9.10",   ***REMOVED*** PostgreSQL adapter
    
    ***REMOVED*** Security
    "passlib>=1.7.4",            ***REMOVED*** Password hashing
    
    ***REMOVED*** Local dependencies - movie-storage installed separately
    ***REMOVED*** "movie-storage @ file://../../../libs/movie-storage",  ***REMOVED*** Local movie storage library
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.10.1",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    ***REMOVED*** Type stubs for better type checking
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.19",
    "types-redis>=4.6.0",
]

[project.scripts]
data-importer = "data_importer.cli:main"

***REMOVED*** Package discovery configuration
[tool.hatch.build.targets.wheel]
packages = ["data_importer"]

[tool.hatch.build.targets.sdist]
packages = ["data_importer"]

***REMOVED*** Specify that the package is in the src directory
[tool.hatch.build.sources]
"src" = ""

***REMOVED*** Allow direct references for local dependencies
[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
***REMOVED*** Enhanced strict settings - now that major issues are fixed
disallow_untyped_defs = true         ***REMOVED*** Now enabled - require type annotations
disallow_incomplete_defs = true      ***REMOVED*** Now enabled - require complete annotations
check_untyped_defs = true
disallow_untyped_decorators = false  ***REMOVED*** Temporarily disabled due to complex decorator typing
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = false     ***REMOVED*** Keep false for external libraries
disallow_untyped_calls = false      ***REMOVED*** Keep false for gradual migration

***REMOVED*** Advanced strictness (selective enablement)
disallow_any_generics = true         ***REMOVED*** Now enabled - require generic parameters
disallow_subclassing_any = true     ***REMOVED*** Now enabled - prevent Any subclassing

***REMOVED*** Warning settings - match bff-api
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

***REMOVED*** Error reporting - enhanced like bff-api
pretty = true
show_column_numbers = true
show_error_context = true
show_error_codes = true              ***REMOVED*** Added for better debugging

***REMOVED*** Importing - more permissive for current state
ignore_missing_imports = true        ***REMOVED*** Keep true for external libraries
follow_imports = "normal"

***REMOVED*** Module-specific overrides for external libraries
[[tool.mypy.overrides]]
module = [
    "requests.*",
    "pydantic.*",
    "click.*",
    "typer.*",
    "rich.*",
    "aiohttp.*",
    "sqlmodel.*",
    "psycopg2.*",
    "passlib.*",
    "movie_storage.*",
    "ptpython.*",
    "dotenv.*"
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist", "data", "logs", ".venv"]
extend-ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"