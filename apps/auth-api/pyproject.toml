[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "auth_api"
version = "0.1.0"
description = "Dedicated authentication service for next_watch movie platform"
readme = {text = "# Auth API\n\nDedicated authentication service for next_watch movie platform", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    {name = "Next Watch Contributors"}
]
maintainers = [
    {name = "Next Watch Contributors"}
]
keywords = [
    "api",
    "authentication",
    "auth",
    "nextwatch",
    "jwt",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
requires-python = ">=3.12"
dependencies = [
    # Core API framework
    "fastapi>=0.104.0",         # API framework
    "uvicorn>=0.23.2",          # ASGI server
    "pydantic>=2.4.2",          # Data validation
    "pydantic-settings>=2.0.0", # Settings management

    # Database
    "sqlalchemy>=2.0.23",       # SQL ORM
    "sqlmodel>=0.0.8",          # SQL Model extension
    "psycopg2-binary>=2.9.10",  # PostgreSQL driver
    "alembic>=1.13.1",          # Database migrations

    # Authentication
    "pyjwt>=2.8.0",             # JWT token handling
    "passlib[bcrypt]>=1.7.4",   # Password hashing
    "bcrypt==3.2.2",            # Specific bcrypt version
    "python-multipart>=0.0.20", # Form data parsing
    "email-validator>=2.2.0",   # Email validation

    # HTTP client
    "httpx>=0.24.0",            # Async HTTP client

    # CLI and utilities
    "typer>=0.15.2",            # CLI framework
    "rich>=13.7.0",             # Terminal formatting
    "python-dotenv>=1.0.0",     # Environment variable loading

    # Date/time handling
    "python-dateutil>=2.9.0",   # Date utilities

    # Cache (for session management)
    "redis>=6.0.0",             # Redis client
    "types-redis>=4.6.0",       # Redis type stubs
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",

    # Code quality
    "ruff>=0.8.4",
    "pyright>=1.1.0",

    # Local NextWatch libraries (for development)
    # "cache @ file:../../libs/cache",
    # "cli @ file:../../libs/cli",
]

[project.scripts]
auth-api = "auth_api.cli.main:main"

[project.urls]
Homepage = "https://github.com/nextwatch/auth-api"
Repository = "https://github.com/nextwatch/auth-api"
Issues = "https://github.com/nextwatch/auth-api/issues"
Documentation = "https://docs.nextwatch.dev/auth-api"

# Hatch configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/auth_api"]

[tool.hatch.build.targets.sdist]
packages = ["src/auth_api"]

[tool.hatch.build.sources]
"src" = ""

# Single consolidated environment
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]

# Install local libraries, so it can be reloaded after changes
install-libs = [
  "pip install -e ../../libs/cache",
  "pip install -e ../../libs/cli",
  "pip install -e ../../libs/config",
  "pip install -e ../../libs/movie-storage",
  "pip install -e ../../libs/fast-core"
]

# Server management
serve = "python -m auth_api.main"
dev = "PYTHONPATH=src uvicorn auth_api.main:create_app --factory --reload --port 8003"

# CLI access
cli = "python -m auth_api.cli"

# Database management
migrate = "python -m auth_api.cli db migrate"
db-init = "python -m auth_api.cli db init"
db-init-tables = "python -m auth_api.cli db init --create-tables"
db-downgrade = "python -m auth_api.cli db downgrade"
db-teardown = "python -m auth_api.cli db teardown --confirm"

# Health checks
health-check = "python -m auth_api.cli health check"
health-db = "python -m auth_api.cli health db"
health-cache = "python -m auth_api.cli health cache"

# Cache management (for sessions)
cache-info = "python -m auth_api.cli cache info"
cache-keys = "python -m auth_api.cli cache keys"
cache-get = "python -m auth_api.cli cache get"
cache-clear = "python -m auth_api.cli cache clear --confirm"

# Auth-specific operations
user-create = "python -m auth_api.cli user create"
user-list = "python -m auth_api.cli user list"
user-disable = "python -m auth_api.cli user disable"
token-verify = "python -m auth_api.cli token verify"
token-revoke = "python -m auth_api.cli token revoke"
session-clean = "python -m auth_api.cli session clean"

# System commands
config = "python -m auth_api.cli config"
version = "python -m auth_api.cli version"
serve-cli = "python -m auth_api.cli serve"

# Development tools
format = "ruff format ."
lint = "ruff check ."
typecheck = "pyright -p pyrightconfig.json"
typecheck-pyright = "pyright -p pyrightconfig.json"
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=src/auth_api/config --cov=src/auth_api/models --cov=src/auth_api/schemas --cov=src/auth_api/dependencies --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml:coverage.xml tests/"

# Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
# Pre-commit runs Ruff from the monorepo root; make import grouping deterministic.
known-first-party = ["auth_api"]
known-third-party = ["cache", "cli", "config", "fast_core", "kafka", "movie_storage"]

# Test

[tool.coverage.run]
branch = true
source = [
    "src/auth_api/config",
    "src/auth_api/models",
    "src/auth_api/schemas",
    "src/auth_api/dependencies",
]

omit = [
    "*/__main__.py",
    "*/cli/*",
    "*/scripts/*",
    "*/db/migrations/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
