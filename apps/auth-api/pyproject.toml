[tool.poetry]
name = "auth-api"
version = "0.1.0"
description = "Dedicated authentication service for next_watch movie platform"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "auth_api", from = "src"}]
include = ["src/auth_api/py.typed"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
pydantic = "^2.4.2"
sqlalchemy = "^2.0.23"
typer = "^0.15.2"
python-dotenv = "^1.0.0"
movie-storage = {path = "../../libs/movie-storage"}
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
email-validator = "^2.1.0"
bcrypt = "3.2.2"
httpx = "^0.24.0"
rich = "^14.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.10.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
auth-api = "auth_api.cli.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 