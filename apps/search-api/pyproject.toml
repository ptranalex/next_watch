[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "search_api"
version = "0.1.0"
description = "Search API for Next Watch platform"
readme = {text = "# Search API\n\nSearch API for Next Watch platform", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Alex Tran" }]
maintainers = [{ name = "Next Watch Contributors" }]
keywords = [
    "api",
    "search",
    "suggestions",
    "nextwatch",
    "redis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
requires-python = ">=3.12"
dependencies = [
    # Core API framework
    "fastapi>=0.104.0",         # API framework
    "uvicorn>=0.23.2",          # ASGI server
    "pydantic>=2.4.2",          # Data validation
    "pydantic-settings>=2.0.0", # Settings management

    # Database
    "sqlalchemy>=2.0.23",       # SQL ORM
    "sqlmodel>=0.0.8",          # SQL Model extension
    "psycopg2-binary>=2.9.10",  # PostgreSQL driver

    # Cache and storage
    "redis>=6.0.0",             # Redis client for caching and suggestions
    "types-redis>=4.6.0",       # Redis type stubs

    # HTTP client for Backend API
    "httpx>=0.24.0",            # Async HTTP client
    "tenacity>=8.2.3",          # Retry logic for HTTP requests

    # CLI and utilities
    "typer>=0.15.2",            # CLI framework
    "rich>=13.7.0",             # Terminal formatting
    "structlog>=23.2.0",        # Structured logging
    "python-dotenv>=1.0.0",     # Environment variable loading

    # Date/time handling
    "python-dateutil>=2.9.0",   # Date utilities

    # Form handling
    "python-multipart>=0.0.20", # Multipart form parsing
    "email-validator>=2.2.0",   # Email validation
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.21.3",
    "respx>=0.20.2",

    # Code quality
    "black>=23.10.1",
    "isort>=5.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",

    # Local NextWatch libraries (for development)
    # "cache @ file:../../libs/cache",
    # "cli @ file:../../libs/cli",
    # "config @ file:../../libs/config",
    # "fast-core @ file:../../libs/fast-core",
]

[project.scripts]
search-api = "search_api.cli.main:main"

[project.urls]
Homepage = "https://github.com/nextwatch/search-api"
Repository = "https://github.com/nextwatch/search-api"
Issues = "https://github.com/nextwatch/search-api/issues"
Documentation = "https://docs.nextwatch.dev/search-api"

# Hatch configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/search_api"]

[tool.hatch.build.targets.sdist]
packages = ["src/search_api"]

[tool.hatch.build.sources]
"src" = ""

# Single consolidated environment
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]

# Install local libraries, so it can be reloaded after changes
install-libs = [
  "pip install -e ../../libs/cache",
  "pip install -e ../../libs/cli",
  "pip install -e ../../libs/config",
  "pip install -e ../../libs/fast-core"
]

# Server management
serve = "python -m search_api.main"
dev = "PYTHONPATH=src uvicorn search_api.main:create_app --factory --reload --port 8005"

# CLI access
cli = "python -m search_api.cli"

# Health checks
health-check = "python -m search_api.cli health check"
health-redis = "python -m search_api.cli health redis"
health-backend = "python -m search_api.cli health backend"

# Cache management
cache-info = "python -m search_api.cli cache info"
cache-keys = "python -m search_api.cli cache keys"
cache-get = "python -m search_api.cli cache get"
cache-clear = "python -m search_api.cli cache clear --confirm"

# Search operations
index-suggestions = "python -m search_api.cli search index-suggestions"
search-test = "python -m search_api.cli search test"

# System commands
config = "python -m search_api.cli config"
version = "python -m search_api.cli version"
serve-cli = "python -m search_api.cli serve"

# Development tools
lint = [
    "black .",
    "isort .",
    "ruff check .",
    "mypy src"
]
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=search_api tests/"
format = [
    "black .",
    "isort ."
]

# Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
# Strict settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true

# Warning settings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

# Error reporting
pretty = true
show_column_numbers = true
show_error_context = true

# Importing
ignore_missing_imports = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "sqlalchemy.*",
    "sqlmodel.*",
    "psycopg2.*",
    "typer.*",
    "rich.*",
    "redis.*",
    "httpx.*",
    "tenacity.*",
    "dateutil.*",
    "email_validator.*"
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
# Pre-commit runs Ruff from the monorepo root, so make first/third-party grouping explicit
# to keep import blocks stable regardless of current working directory.
known-first-party = ["search_api"]
known-third-party = ["cache", "cli", "config", "fast_core", "kafka", "movie_storage"]
