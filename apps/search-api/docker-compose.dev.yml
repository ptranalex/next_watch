# Development docker-compose for Search API
# Use this for local testing of the search-api service
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build

version: "3.8"

services:
  search-api:
    build:
      context: ../.. # Build from monorepo root
      dockerfile: apps/search-api/Dockerfile
    container_name: search-api-dev
    ports:
      - "8004:8004"
    environment:
      # Core Service Configuration
      - ENVIRONMENT=development
      - SERVICE_NAME=search-api
      - HOST=0.0.0.0
      - PORT=8004
      - DEBUG=true
      - LOG_LEVEL=debug
      - LOGS_DIR=/app/logs

      # External Service URLs (pointing to host services)
      - BACKEND_API_URL=http://host.docker.internal:8000
      - BACKEND_API_TIMEOUT=30
      - ML_API_URL=http://host.docker.internal:8005
      - ML_API_TIMEOUT=60

      # Redis Configuration
      - REDIS_URL=redis://redis:6379/2
      - REDIS_MAX_CONNECTIONS=20
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_RETRY_ON_TIMEOUT=true

      # Search-specific Settings
      - MAX_SUGGESTIONS=50
      - SEARCH_CACHE_TTL=300
      - SUGGESTION_CACHE_TTL=3600
      - MIN_QUERY_LENGTH=1
      - MAX_QUERY_LENGTH=100

      # Feature Flags
      - ENABLE_SEMANTIC_SEARCH=false
      - ENABLE_SEARCH_ANALYTICS=true
      - ENABLE_FUZZY_MATCHING=true
      - ENABLE_TYPO_TOLERANCE=true

      # Security (development settings)
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001"]
      - ALLOWED_HOSTS=["localhost", "127.0.0.1", "search-api", "0.0.0.0"]
      - INTERNAL_API_KEY=search-to-backend-secret-key

      # Performance Settings
      - ENABLE_PERFORMANCE_METRICS=true
      - ENABLE_METRICS=true
      - CACHE_ENABLE_METRICS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - search-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis for search suggestions and caching
  redis:
    image: redis:7-alpine
    container_name: search-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  search-logs:
    driver: local
  redis-data:
    driver: local

networks:
  default:
    name: search-api-dev
