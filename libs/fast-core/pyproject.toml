[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "fast-core"
version = "0.1.0"
description = "Core FastAPI utilities and patterns for Next Watch services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Next Watch Team" },
]
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "config",  ***REMOVED*** Local dependency
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.0.285",
]
monitoring = [
    "prometheus-client>=0.17.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]
cache = [
    "redis>=5.0.0",
    "cache",  ***REMOVED*** Local dependency
]
security = [
    "PyJWT>=2.8.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
]
database = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
]
all = [
    "fast-core[monitoring,cache,security,database]",
]

[project.urls]
Repository = "https://github.com/yourusername/next_watch"

***REMOVED*** Hatch configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/fast_core"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fast_core",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.sources]
"src" = ""

***REMOVED*** Single consolidated environment
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]
***REMOVED*** Install local libraries, so they can be reloaded after changes
install-libs = [
  "pip install -e ../../libs/config",
  "pip install -e ../../libs/cache",
  "pip install -e ../../libs/cli"
]

***REMOVED*** Development tools
lint = [
    "black .",
    "isort .",
    "ruff check .",
    "mypy src"
]
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=fast_core tests/"
format = [
    "black .",
    "isort ."
]

***REMOVED*** Example app
example = "PYTHONPATH=src python examples/basic_app.py"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["fast_core"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "httpx.*",
    "redis.*",
    "jwt.*",
    "jose.*",
    "passlib.*",
    "bcrypt.*",
    "prometheus_client.*",
    "opentelemetry.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "--cov=fast_core --cov-report=term --cov-report=xml:coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "B", "C4", "SIM", "ARG", "PIE", "PL", "RUF"]
ignore = ["E203", "PLR0913"]

[tool.ruff.isort]
known-first-party = ["fast_core"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["PLR2004"] 