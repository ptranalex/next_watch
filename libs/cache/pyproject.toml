[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache"
version = "0.1.0"
description = "NextWatch unified Redis caching library with typed keys and domain-specific TTL management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Alex Tran", email = "p.tran.alex@gmail.com" },
]
maintainers = [
    { name = "Alex Tran", email = "p.tran.alex@gmail.com" },
]
keywords = [
    "cache",
    "redis",
    "performance",
    "microservices",
    "nextwatch",
    "async",
    "json",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Database",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    ***REMOVED*** Redis client with async support
    "redis[hiredis]>=5.0.0",

    ***REMOVED*** Configuration and validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    ***REMOVED*** CLI and rich output
    "typer>=0.15.2",
    "rich>=14.0.0",

    ***REMOVED*** Structured logging
    "structlog>=23.0.0",

    ***REMOVED*** Type support
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    ***REMOVED*** Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "fakeredis>=2.18.0",
    "httpx>=0.24.0",

    ***REMOVED*** Type checking
    "mypy>=1.5.0",
    "types-redis>=4.6.0",

    ***REMOVED*** Linting and formatting
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",

    ***REMOVED*** Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.23.0",
]

[project.scripts]
cache = "cache.cli:main"

[project.urls]
Homepage = "https://github.com/nextwatch/cache"
Documentation = "https://nextwatch.github.io/cache"
Repository = "https://github.com/nextwatch/cache"
"Bug Tracker" = "https://github.com/nextwatch/cache/issues"

***REMOVED*** Hatch configuration
[tool.hatch.version]
path = "src/cache/__init__.py"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/cache"]

[tool.hatch.build.targets.sdist]
packages = ["src/cache"]

[tool.hatch.build.sources]
"src" = ""

***REMOVED*** Single consolidated environment
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.scripts]
***REMOVED*** Testing
test = "pytest {args:tests}"
test-cov = "pytest --cov=cache {args:tests}"
test-unit = "pytest -m 'not integration' {args:tests}"
test-integration = "pytest -m integration {args:tests}"

***REMOVED*** Code quality
type-check = "mypy src/cache"
lint = "ruff check src/cache tests examples"
format = "ruff format src/cache tests examples"
check = ["lint", "type-check"]

***REMOVED*** Documentation
docs-build = "mkdocs build"
docs-serve = "mkdocs serve --dev-addr localhost:8001"

***REMOVED*** Combined commands
all = ["format", "check", "test-cov"]
example = "python examples/basic_usage.py"

***REMOVED*** Tool configurations
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=cache",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests requiring Redis",
    "unit: marks tests as unit tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "fakeredis.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",  ***REMOVED*** pycodestyle errors
    "W",  ***REMOVED*** pycodestyle warnings
    "F",  ***REMOVED*** pyflakes
    "I",  ***REMOVED*** isort
    "B",  ***REMOVED*** flake8-bugbear
    "C4", ***REMOVED*** flake8-comprehensions
    "UP", ***REMOVED*** pyupgrade
    "N",  ***REMOVED*** pep8-naming
]
ignore = [
    "E501",  ***REMOVED*** line too long, handled by formatter
    "B008",  ***REMOVED*** do not perform function calls in argument defaults
    "C901",  ***REMOVED*** too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  ***REMOVED*** Allow unused imports in __init__.py
"tests/**/*" = ["B011"]   ***REMOVED*** Allow assert False in tests
"examples/**/*" = ["T201"] ***REMOVED*** Allow print statements in examples

[tool.ruff.isort]
known-first-party = ["cache"]

[tool.coverage.run]
source = ["src/cache"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
