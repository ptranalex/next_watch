[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "config"
version = "0.1.0"
description = "Unified configuration management library for NextWatch monorepo"
readme = {text = "***REMOVED*** NextWatch Configuration Library\n\nUnified configuration management for NextWatch services", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    {name = "Alex Tran", email = "p.tran.alex@gmail.com"}
]
maintainers = [
    {name = "Alex Tran", email = "p.tran.alex@gmail.com"}
]
keywords = [
    "configuration",
    "settings",
    "environment",
    "pydantic",
    "nextwatch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    ***REMOVED*** Core configuration dependencies
    "pydantic>=2.4.2",           ***REMOVED*** Data validation and settings
    "pydantic-settings>=2.1.0",  ***REMOVED*** Settings management
    "python-dotenv>=1.0.0",      ***REMOVED*** Environment variable loading

    ***REMOVED*** Structured logging
    "structlog>=24.1.0",         ***REMOVED*** Structured logging

    ***REMOVED*** CLI framework
    "typer>=0.15.2",             ***REMOVED*** CLI framework
    "rich>=13.7.0",              ***REMOVED*** Terminal formatting
]

[project.optional-dependencies]
dev = [
    ***REMOVED*** Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",

    ***REMOVED*** Code quality
    "black>=23.10.1",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",

    ***REMOVED*** Pre-commit hooks
    "pre-commit>=3.6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
config = "config.cli.main:main"

[project.urls]
Homepage = "https://github.com/nextwatch/nextwatch/tree/main/libs/config"
Repository = "https://github.com/nextwatch/nextwatch/tree/main/libs/config"
Issues = "https://github.com/nextwatch/nextwatch/issues"
Documentation = "https://docs.nextwatch.dev/config"

***REMOVED*** Hatch configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/config"]

[tool.hatch.build.targets.sdist]
packages = ["src/config"]

[tool.hatch.build.sources]
"src" = ""

***REMOVED*** Single consolidated environment for everything
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]

***REMOVED*** CLI access
cli = "python -m config.cli"

***REMOVED*** Configuration utilities
validate = "python -m config.cli validate"
display = "python -m config.cli display"
export = "python -m config.cli export"

***REMOVED*** Development tools
lint = [
    "black .",
    "isort .",
    "flake8 .",
    "mypy src"
]
test = "PYTHONPATH=src pytest {args:tests}"
test-cov = "PYTHONPATH=src pytest --cov=config tests/"
format = [
    "black .",
    "isort ."
]

***REMOVED*** Testing different service configurations
test-backend-api = "python -m config.testing.test_backend_api"
test-bff-api = "python -m config.testing.test_bff_api"
test-auth-api = "python -m config.testing.test_auth_api"

***REMOVED*** Example configurations
example-backend = "python examples/backend_api_config.py"
example-bff = "python examples/bff_api_config.py"
example-worker = "python examples/worker_config.py"

***REMOVED*** Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=nextwatch_config",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.mypy]
python_version = "3.12"
***REMOVED*** Strict settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true

***REMOVED*** Warning settings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

***REMOVED*** Error reporting
pretty = true
show_column_numbers = true
show_error_context = true

***REMOVED*** Importing
ignore_missing_imports = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "pydantic_settings.*",
    "dotenv.*",
    "structlog.*",
    "typer.*",
    "rich.*",
    "tests.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["config"]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]
extend-ignore = ["E203"]
