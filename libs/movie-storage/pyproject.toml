[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "movie-storage"
version = "0.1.0"
description = "Database storage operations for movie data"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = {text = "# Movie Storage\n\nDatabase storage operations for movie data", content-type = "text/markdown"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core database dependencies
    "sqlmodel>=0.0.8",           # SQLModel for ORM
    "sqlalchemy>=2.0.23",        # SQLAlchemy for database operations
    "alembic<=1.13.1",           # Database migrations
    "psycopg2-binary>=2.9.10",   # PostgreSQL adapter

    # Configuration and utilities
    "python-dotenv>=1.0.0",      # Environment variable loading
    "passlib[bcrypt]>=1.7.4",    # Password hashing

    # CLI dependencies
    "typer>=0.15.2",             # CLI framework
    "rich>=14.0.0",              # Rich text output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "black>=23.10.1",
    "isort>=5.12.0",
    "mypy>=1.7.0",
]

[project.scripts]
movie-db = "movie_storage.cli:main"

# Allow direct references to local dependencies
[tool.hatch.metadata]
allow-direct-references = true

# Package discovery configuration
[tool.hatch.build.targets.wheel]
packages = ["movie_storage"]
include = ["movie_storage/py.typed"]

[tool.hatch.build.targets.sdist]
packages = ["movie_storage"]

# Version configuration (temporarily static)
# [tool.hatch.version]
# source = "vcs"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
# Common strict settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

# Warning settings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Error reporting
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

# Import handling
ignore_missing_imports = true

# Specific override for SQLAlchemy to handle import issues
[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

# Allow untyped calls for third-party libraries
[[tool.mypy.overrides]]
module = "movie_storage.db.migrations.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Allow more flexible typing for models due to SQLModel/SQLAlchemy
[[tool.mypy.overrides]]
module = "movie_storage.models.*"
disallow_untyped_decorators = false

# CLI commands - less strict for typer integration
[[tool.mypy.overrides]]
module = "movie_storage.cli.commands.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
