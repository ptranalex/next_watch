[tool.poetry]
name = "movie-storage"
version = "0.1.0"
description = "Database storage operations for movie data"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.8"
sqlmodel = ">=0.0.8"
movie-schema = {path = "../movie-schema", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=22.3.0"
isort = ">=5.10.1"
mypy = ">=0.950"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true 