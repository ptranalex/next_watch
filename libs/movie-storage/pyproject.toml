[tool.poetry]
name = "movie-storage"
version = "0.1.0"
description = "Database storage operations for movie data"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "movie_storage"}]
include = ["movie_storage/py.typed"]

[tool.poetry.dependencies]
python = ">=3.8"
sqlmodel = ">=0.0.8"
sqlalchemy = ">=1.4.0"
python-dotenv = ">=0.19.0"
psycopg2-binary = "^2.9.10"
typer = "^0.15.2"
rich = "^14.0.0"
alembic = "<=1.13.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=22.3.0"
isort = ">=5.10.1"
mypy = ">=0.950"

[tool.poetry.scripts]
movie-db = "movie_storage.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true 