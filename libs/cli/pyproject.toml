[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "cli"
version = "0.1.0"
description = "NextWatch CLI utilities and framework for consistent command-line interfaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    {name = "Alex Tran", email = "p.tran.alex@gmail.com"}
]
maintainers = [
    {name = "Alex Tran", email = "p.tran.alex@gmail.com"}
]
keywords = [
    "cli",
    "command-line",
    "typer",
    "rich",
    "nextwatch",
    "framework",
    "utilities",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    ***REMOVED*** Core CLI framework
    "typer>=0.15.2",            ***REMOVED*** CLI framework
    "rich>=13.7.0",             ***REMOVED*** Terminal formatting
    "coloredlogs>=15.0.0",      ***REMOVED*** Colored logging

    ***REMOVED*** Async support
    "httpx>=0.24.0",            ***REMOVED*** Async HTTP client
    "redis>=6.0.0",             ***REMOVED*** Redis client
    "types-redis>=4.6.0",       ***REMOVED*** Redis type stubs

    ***REMOVED*** Structured logging
    "structlog>=23.2.0",        ***REMOVED*** Structured logging

    ***REMOVED*** Configuration and validation
    "pydantic>=2.4.2",          ***REMOVED*** Data validation
    "python-dotenv>=1.0.0",     ***REMOVED*** Environment variable loading

    ***REMOVED*** Utilities
    "tenacity>=8.2.3",          ***REMOVED*** Retry logic
    "python-dateutil>=2.9.0",   ***REMOVED*** Date utilities
]

[project.optional-dependencies]
dev = [
    ***REMOVED*** Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",

    ***REMOVED*** Code quality
    "black>=23.10.1",
    "isort>=5.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "types-python-dateutil>=2.9.0",
    "pre-commit>=3.4.0",

    ***REMOVED*** Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.23.0",
]

test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/nextwatch/cli"
Repository = "https://github.com/nextwatch/cli"
Issues = "https://github.com/nextwatch/cli/issues"
Documentation = "https://docs.nextwatch.dev/cli"

***REMOVED*** Hatch configuration
[tool.hatch.version]
path = "src/cli/__init__.py"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.hatch.build.targets.sdist]
packages = ["src/cli"]

[tool.hatch.build.sources]
"src" = ""

***REMOVED*** Development environment
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["dev"]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.default.scripts]
***REMOVED*** Testing
test = "pytest {args:tests}"
test-cov = "pytest --cov=cli --cov-report=term-missing {args:tests}"
test-html = "pytest --cov=cli --cov-report=html {args:tests}"

***REMOVED*** Code quality
lint = [
    "black --check .",
    "isort --check-only .",
    "ruff check .",
    "mypy src"
]
format = [
    "black .",
    "isort .",
    "ruff format ."
]
type-check = "mypy src"

***REMOVED*** Quality gates
check = ["format", "lint", "type-check"]
all = ["check", "test-cov"]

***REMOVED*** Documentation
docs-build = "mkdocs build"
docs-serve = "mkdocs serve --dev-addr localhost:8080"

***REMOVED*** Testing environment
[tool.hatch.envs.test]
features = ["test"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"
cov = "pytest --cov=cli --cov-report=term-missing {args:tests}"
cov-html = "pytest --cov=cli --cov-report=html {args:tests}"

***REMOVED*** Documentation environment
[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build"
serve = "mkdocs serve --dev-addr localhost:8080"

***REMOVED*** Tool configurations
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=cli",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
***REMOVED*** Strict settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
disallow_any_unimported = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true

***REMOVED*** Warning settings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

***REMOVED*** Error reporting
pretty = true
show_column_numbers = true
show_error_context = true

***REMOVED*** Importing
ignore_missing_imports = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "typer.*",
    "rich.*",
    "coloredlogs.*",
    "httpx.*",
    "redis.*",
    "structlog.*",
    "pydantic.*",
    "tenacity.*",
    "dateutil.*"
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["cli"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   ***REMOVED*** pycodestyle errors
    "W",   ***REMOVED*** pycodestyle warnings
    "F",   ***REMOVED*** pyflakes
    "I",   ***REMOVED*** isort
    "B",   ***REMOVED*** flake8-bugbear
    "C4",  ***REMOVED*** flake8-comprehensions
    "UP",  ***REMOVED*** pyupgrade
    "SIM", ***REMOVED*** flake8-simplify
]
ignore = [
    "E501", ***REMOVED*** line too long, handled by black
    "B008", ***REMOVED*** do not perform function calls in argument defaults
    "C901", ***REMOVED*** too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  ***REMOVED*** Allow unused imports in __init__.py
"tests/**/*" = ["B011"]   ***REMOVED*** Allow assert False in tests

[tool.ruff.lint.isort]
known-first-party = ["cli"]

[tool.coverage.run]
source = ["cli"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
