[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kafka"
version = "0.1.0"
description = "Shared Kafka integration library for Next Watch microservices"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Next Watch Team" }
]
dependencies = [
    "aiokafka>=0.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
]

[project.optional-dependencies]
avro = [
    "fastavro>=1.9.0",
    "python-schema-registry-client>=2.5.0",
    "httpx>=0.25.0",
]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.0.285",
    "black>=23.7.0",
]

[project.scripts]
kafka-schemas = "kafka.cli.register_schemas:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kafka"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "black",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=src/kafka --cov=tests {args:tests}"
lint = [
    "ruff check src tests",
    "black --check src tests",
    "mypy src",
]
format = [
    "black src tests",
    "ruff check --fix src tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

