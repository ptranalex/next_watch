***REMOVED*** Prometheus Configuration for NextWatch Platform
***REMOVED*** Clean, production-ready configuration for containerized deployment

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "nextwatch-aws"
    region: "ap-southeast-1"
    instance: "i-0c78dddbab78124cb"

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  ***REMOVED*** NextWatch Services (Working Services Only)
  - job_name: "nextwatch-backend-api"
    static_configs:
      - targets: ["backend-api:8000"]
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "backend-api"
      - target_label: environment
        replacement: "production"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-bff-api"
    static_configs:
      - targets: ["bff-api:8000"] ***REMOVED*** BFF API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "bff-api"
      - target_label: environment
        replacement: "production"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-auth-api"
    static_configs:
      - targets: ["auth-api:8000"] ***REMOVED*** Auth API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "auth-api"
      - target_label: environment
        replacement: "production"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-search-api"
    static_configs:
      - targets: ["search-api:8000"] ***REMOVED*** Search API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "search-api"
      - target_label: environment
        replacement: "production"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  ***REMOVED*** Monitoring Stack Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s
    relabel_configs:
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"
      - target_label: instance
        replacement: "production-server"

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
    scrape_interval: 30s

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    scrape_interval: 30s
  - job_name: "nextwatch-ml-api"
    static_configs:
      - targets: ["ml-api:8000"] ***REMOVED*** ML API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "ml-api"
      - target_label: environment
        replacement: "production"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-recommendation-api"
    static_configs:
      - targets: ["recommendation-api:8000"] ***REMOVED*** Recommendation API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "recommendation-api"
      - target_label: environment
        replacement: "production"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  ***REMOVED*** Blackbox Exporter Self-Monitoring
  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]
    scrape_interval: 30s

  ***REMOVED*** Health Endpoint Monitoring via Blackbox Exporter
  - job_name: "nextwatch-health-endpoints"
    metrics_path: /probe
    params:
      module: [http_health] ***REMOVED*** Use module that accepts 200 or 503
    static_configs:
      - targets:
          - "http://backend-api:8000/health"
          - "http://bff-api:8000/health"
          - "http://auth-api:8000/health"
          - "http://search-api:8000/health"
          - "http://ml-api:8000/health"
          - "http://recommendation-api:8000/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: "http://([^:]+):.*"
        target_label: service
        replacement: "${1}"
      - target_label: probe_type
        replacement: "health"
      - target_label: environment
        replacement: "production"

  ***REMOVED*** Readiness Endpoint Monitoring via Blackbox Exporter
  - job_name: "nextwatch-readiness-endpoints"
    metrics_path: /probe
    params:
      module: [http_readiness] ***REMOVED*** Must be 200 only
    static_configs:
      - targets:
          - "http://backend-api:8000/health/ready"
          - "http://bff-api:8000/health/ready"
          - "http://auth-api:8000/health/ready"
          - "http://search-api:8000/health/ready"
          - "http://ml-api:8000/health/ready"
          - "http://recommendation-api:8000/health/ready"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: "http://([^:]+):.*"
        target_label: service
        replacement: "${1}"
      - target_label: probe_type
        replacement: "readiness"
      - target_label: environment
        replacement: "production"

  ***REMOVED*** Service Connectivity Check (TCP)
  - job_name: "nextwatch-service-connectivity"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "backend-api:8000"
          - "bff-api:8000"
          - "auth-api:8000"
          - "search-api:8000"
          - "ml-api:8000"
          - "recommendation-api:8000"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "${1}"
      - target_label: probe_type
        replacement: "tcp"
      - target_label: environment
        replacement: "production"
