global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "production"
    environment: "prod"

***REMOVED*** Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

***REMOVED*** Load alert rules
rule_files:
  - "rules/*.yml"

***REMOVED*** Scrape configurations
scrape_configs:
  ***REMOVED*** Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
    metrics_path: /metrics

  ***REMOVED*** NextWatch Application Services
  - job_name: "nextwatch-services-backend"
    static_configs:
      - targets: ["backend-api:8000"]
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ["prometheus"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: "backend-api"
      - source_labels: [__address__]
        target_label: instance
        replacement: "backend-api:8000"

  - job_name: "nextwatch-services-bff"
    static_configs:
      - targets: ["bff-api:8001"]
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ["prometheus"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: "bff-api"
      - source_labels: [__address__]
        target_label: instance
        replacement: "bff-api:8001"

  - job_name: "nextwatch-services-auth"
    static_configs:
      - targets: ["auth-api:8003"]
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ["prometheus"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: "auth-api"
      - source_labels: [__address__]
        target_label: instance
        replacement: "auth-api:8003"

  - job_name: "nextwatch-services-search"
    static_configs:
      - targets: ["search-api:8005"]
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ["prometheus"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: "search-api"
      - source_labels: [__address__]
        target_label: instance
        replacement: "search-api:8005"

  - job_name: "nextwatch-services-recommendation"
    static_configs:
      - targets: ["recommendation-api:8002"]
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ["prometheus"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: "recommendation-api"
      - source_labels: [__address__]
        target_label: instance
        replacement: "recommendation-api:8002"

  - job_name: "nextwatch-services-ml"
    static_configs:
      - targets: ["ml-api:8004"]
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ["prometheus"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: "ml-api"
      - source_labels: [__address__]
        target_label: instance
        replacement: "ml-api:8004"

  ***REMOVED*** Infrastructure monitoring
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "production-server"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 30s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "production-containers"

  ***REMOVED*** Monitoring stack self-monitoring
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
    scrape_interval: 30s

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    scrape_interval: 30s
    metrics_path: /metrics

  ***REMOVED*** PostgreSQL monitoring (if using postgres_exporter)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "production-postgres"

  ***REMOVED*** Redis monitoring (if using redis_exporter)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "production-redis"

  ***REMOVED*** External health checks (blackbox exporter)
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://alexsandbox.me/health
          - https://alexsandbox.me/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
***REMOVED*** Remote storage configuration (optional - for long-term storage)
***REMOVED*** remote_write:
***REMOVED***   - url: "https://prometheus-remote-write-endpoint.com/api/v1/write"
***REMOVED***     headers:
***REMOVED***       Authorization: "Bearer YOUR_TOKEN"
***REMOVED***     queue_config:
***REMOVED***       max_samples_per_send: 1000
***REMOVED***       max_shards: 200
***REMOVED***       capacity: 2500
