# Prometheus Configuration for NextWatch Platform
# Clean, local-ready configuration for containerized deployment

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "nextwatch-aws"
    region: "ap-southeast-1"
    instance: "i-0c78dddbab78124cb"

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # NextWatch Services (Working Services Only)
  - job_name: "nextwatch-backend-api"
    static_configs:
      - targets: ["localhost:8000"]
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "backend-api"
      - target_label: environment
        replacement: "local"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-bff-api"
    static_configs:
      - targets: ["localhost:8001"] # BFF API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "bff-api"
      - target_label: environment
        replacement: "local"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-auth-api"
    static_configs:
      - targets: ["localhost:8002"] # Auth API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "auth-api"
      - target_label: environment
        replacement: "local"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-search-api"
    static_configs:
      - targets: ["localhost:8003"] # Search API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "search-api"
      - target_label: environment
        replacement: "local"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  # Monitoring Stack Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s
    relabel_configs:
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"
      - target_label: instance
        replacement: "local-server"

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
    scrape_interval: 30s

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    scrape_interval: 30s
  - job_name: "nextwatch-ml-api"
    static_configs:
      - targets: ["localhost:8004"] # ML API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "ml-api"
      - target_label: environment
        replacement: "local"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

  - job_name: "nextwatch-recommendation-api"
    static_configs:
      - targets: ["localhost:8005"] # Recommendation API runs on internal port 8000
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: "recommendation-api"
      - target_label: environment
        replacement: "local"
      - target_label: instance_id
        replacement: "i-0c78dddbab78124cb"

    # Health Check Trigger - Calls /health endpoints to update native metrics
  - job_name: "nextwatch-health-trigger"
    static_configs:
      - targets:
          - "localhost:8000"
          - "localhost:8001"
          - "localhost:8002"
          - "localhost:8003"
          - "localhost:8004"
          - "localhost:8005"
    scrape_interval: 30s
    metrics_path: /health
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        regex: "host.docker.internal:(.+)"
        target_label: service
        replacement: "service-${1}"
      - target_label: environment
        replacement: "local"
      - target_label: probe_type
        replacement: "health_trigger"

  # Blackbox Exporter Self-Monitoring
  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]
    scrape_interval: 30s

  # Health Endpoint Monitoring via Blackbox Exporter
  - job_name: "nextwatch-health-endpoints"
    metrics_path: /probe
    params:
      module: [http_health] # Use module that accepts 200 or 503
    static_configs:
      - targets:
          - "http://localhost:8000/health"
          - "http://localhost:8001/health"
          - "http://localhost:8002/health"
          - "http://localhost:8003/health"
          - "http://localhost:8004/health"
          - "http://localhost:8005/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: "http://([^:]+):.*"
        target_label: service
        replacement: "${1}"
      - target_label: probe_type
        replacement: "health"
      - target_label: environment
        replacement: "local"

  # Readiness Endpoint Monitoring via Blackbox Exporter
  - job_name: "nextwatch-readiness-endpoints"
    metrics_path: /probe
    params:
      module: [http_readiness] # Must be 200 only
    static_configs:
      - targets:
          - "http://localhost:8000/health/ready"
          - "http://localhost:8001/health/ready"
          - "http://localhost:8002/health/ready"
          - "http://localhost:8003/health/ready"
          - "http://localhost:8004/health/ready"
          - "http://localhost:8005/health/ready"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: "http://([^:]+):.*"
        target_label: service
        replacement: "${1}"
      - target_label: probe_type
        replacement: "readiness"
      - target_label: environment
        replacement: "local"

  # Service Connectivity Check (TCP)
  - job_name: "nextwatch-service-connectivity"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "localhost:8000"
          - "localhost:8001"
          - "localhost:8002"
          - "localhost:8003"
          - "localhost:8004"
          - "localhost:8005"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "${1}"
      - target_label: probe_type
        replacement: "tcp"
      - target_label: environment
        replacement: "local"
