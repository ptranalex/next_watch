auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64
        ttl: 1h

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093

# Balanced limits for shared t3.medium instance
limits_config:
  retention_period: 10d
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_concurrent_tail_requests: 10
  max_global_streams_per_user: 7500
  max_query_length: 168h
  max_query_parallelism: 6
  max_streams_per_user: 0
  max_line_size: 65536
  max_entries_limit_per_query: 2500

# Balanced compactor for shared instance
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 20m
  retention_enabled: true
  retention_delete_delay: 1h
  retention_delete_worker_count: 75

# Balanced ingester for shared instance
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  max_transfer_retries: 0
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true
  chunk_target_size: 1572864
  chunk_encoding: snappy
  chunk_idle_period: 30m
  max_chunk_age: 1h

# Table manager for cleanup
table_manager:
  retention_deletes_enabled: true
  retention_period: 10d

analytics:
  reporting_enabled: false
