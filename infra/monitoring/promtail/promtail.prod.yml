server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  ***REMOVED*** Docker container logs
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.+)'
        target_label: container_name
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: time
            message: msg
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          stream:

  ***REMOVED*** NextWatch application logs
  - job_name: nextwatch-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-api
          service: backend-api
          __path__: /app/logs/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
            trace_id: trace_id
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          trace_id:

  - job_name: nextwatch-bff
    static_configs:
      - targets:
          - localhost
        labels:
          job: bff-api
          service: bff-api
          __path__: /app/logs/bff/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
            trace_id: trace_id
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          trace_id:

  - job_name: nextwatch-auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth-api
          service: auth-api
          __path__: /app/logs/auth/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  - job_name: nextwatch-search
    static_configs:
      - targets:
          - localhost
        labels:
          job: search-api
          service: search-api
          __path__: /app/logs/search/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  - job_name: nextwatch-recommendation
    static_configs:
      - targets:
          - localhost
        labels:
          job: recommendation-api
          service: recommendation-api
          __path__: /app/logs/recommendation/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  - job_name: nextwatch-ml
    static_configs:
      - targets:
          - localhost
        labels:
          job: ml-api
          service: ml-api
          __path__: /app/logs/ml/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  ***REMOVED*** System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<process>\S+):\s+(?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: 'Jan _2 15:04:05'
      - labels:
          hostname:
          process:

  ***REMOVED*** Docker daemon logs
  - job_name: docker-daemon
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/log/docker.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: time
            message: msg
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          stream:
          container_name: container_name
          docker_image: docker_image
          docker_container_id: docker_container_id
          docker_container_name: docker_container_name
          docker_container_image: docker_container_image
          docker_container_labels: docker_container_labels
          docker_container_command: docker_container_command
          docker_container_created: docker_container_created
          docker_container_status: docker_container_status
          docker_container_ports: docker_container_ports
