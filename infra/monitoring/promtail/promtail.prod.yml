          docker_container_labels_com_docker_compose_project: docker_container_labels_com_docker_compose_project
          docker_container_labels_com_docker_compose_version: docker_container_labels_com_docker_compose_version
          docker_container_labels_com_docker_compose_config: docker_container_labels_com_docker_compose_config
