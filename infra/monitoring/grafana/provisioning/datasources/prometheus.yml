apiVersion: 1

datasources:
  # Prometheus - Metrics
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: GET
      # Configure exemplars to link to Tempo traces
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: TraceID
    editable: true

  # Loki - Logs
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      # Configure derived fields to extract trace IDs from logs
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "trace_id=([a-f0-9]+)"
          name: TraceID
          url: "$${__value.raw}"
        - datasourceUid: tempo
          matcherRegex: "traceID=([a-f0-9]+)"
          name: TraceID
          url: "$${__value.raw}"
        - datasourceUid: tempo
          matcherRegex: "[tT]race[_-]?[iI][dD][\":\\s=]+([a-f0-9]+)"
          name: TraceID
          url: "$${__value.raw}"
    editable: true

  # Tempo - Distributed Tracing
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      # Configure node graph for service map visualization
      nodeGraph:
        enabled: true
      # Configure trace to logs correlation
      tracesToLogsV2:
        datasourceUid: loki
        filterBySpanID: false
        filterByTraceID: true
        customQuery: false
        tags:
          - key: service.name
            value: service
          - key: service_name
            value: service
      # Configure trace to metrics correlation
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
          - key: service_name
            value: service
        queries:
          - name: Request Rate
            query: sum(rate(http_requests_total{service="$${__tags.service}"}[5m]))
          - name: Request Duration P99
            query: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="$${__tags.service}"}[5m])) by (le))
          - name: Error Rate
            query: sum(rate(http_requests_total{service="$${__tags.service}", status_code=~"5.."}[5m])) / sum(rate(http_requests_total{service="$${__tags.service}"}[5m]))
      # Configure service map
      serviceMap:
        datasourceUid: prometheus
      # Configure search settings
      search:
        hide: false
      # Configure span bar settings
      spanBar:
        type: Tag
        tag: http.status_code
    editable: true
