apiVersion: 1

providers:
  - name: "NextWatch Dashboards"
    orgId: 1
    folder: "NextWatch"
    folderUid: "nextwatch-folder"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/nextwatch

  - name: "Infrastructure Dashboards"
    orgId: 1
    folder: "Infrastructure"
    folderUid: "infrastructure-folder"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/infrastructure

  - name: "Business Metrics"
    orgId: 1
    folder: "Business"
    folderUid: "business-folder"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/business
