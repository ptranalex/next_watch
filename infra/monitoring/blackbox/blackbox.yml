modules:
  # HTTP 2xx health check - for /health endpoints
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"

  # HTTP health check that accepts degraded status (200 or 503)
  http_health:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200, 503] # Accept both healthy and degraded
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"

  # HTTP readiness check - must be 200
  http_readiness:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"

  # TCP port check - for basic connectivity
  tcp_connect:
    prober: tcp
    timeout: 5s

  # ICMP ping check - for network connectivity
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"
