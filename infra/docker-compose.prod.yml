services:
  ***REMOVED*** Backend API - Core service
  backend-api:
    image: ${DOCKER_BACKEND_IMAGE}
    container_name: backend-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOGS_DIR=/app/logs
      ***REMOVED*** Database Configuration
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
      ***REMOVED*** Redis Configuration
      - REDIS_URL=redis://host.docker.internal:6379/0
      - REDIS_MAX_CONNECTIONS=20
      - REDIS_TIMEOUT=5
      - REDIS_RETRY_ON_TIMEOUT=true
      ***REMOVED*** JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_JWK=${JWT_JWK:-}
      - JWT_JWK_ROTATION_INTERVAL=${JWT_JWK_ROTATION_INTERVAL:-86400}
      ***REMOVED*** Security Configuration
      - CORS_ORIGINS=https://alexsandbox.me,http://localhost:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      ***REMOVED*** Performance
      - ENABLE_PERFORMANCE_METRICS=true
      - SQLALCHEMY_LOG_LEVEL=WARNING
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  ***REMOVED*** Auth API - Authentication service
  auth-api:
    image: ${DOCKER_AUTH_IMAGE}
    container_name: auth-api
    restart: always
    ports:
      - "8003:8003"
    environment:
      - ENVIRONMENT=production
      - AUTH_API_PORT=8003
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOGS_DIR=/app/logs
      ***REMOVED*** Database Configuration
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
      ***REMOVED*** JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - JWT_JWK=${JWT_JWK:-}
      - JWT_JWK_ROTATION_INTERVAL=${JWT_JWK_ROTATION_INTERVAL:-86400}
      ***REMOVED*** Security Configuration
      - PASSWORD_HASH_ROUNDS=12
      - MAX_LOGIN_ATTEMPTS=5
      - LOGIN_LOCKOUT_DURATION_MINUTES=15
      - SESSION_TIMEOUT_MINUTES=60
      - CORS_ORIGINS=https://alexsandbox.me,http://localhost:3000,http://localhost:8001
      ***REMOVED*** Performance
      - ENABLE_PERFORMANCE_METRICS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - auth-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  ***REMOVED*** BFF API - Backend for Frontend
  bff-api:
    image: ${DOCKER_BFF_IMAGE}
    container_name: bff-api
    restart: always
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOGS_DIR=/app/logs
      ***REMOVED*** Service URLs
      - BACKEND_API_URL=http://backend-api:8000
      - AUTH_API_URL=http://auth-api:8003
      - BACKEND_API_TIMEOUT=30
      ***REMOVED*** Redis Configuration
      - REDIS_URL=redis://host.docker.internal:6379/0
      - CACHE_TTL=300
      ***REMOVED*** JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      ***REMOVED*** Security Configuration
      - CORS_ORIGINS=https://alexsandbox.me,http://localhost:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      ***REMOVED*** Performance
      - ENABLE_PERFORMANCE_METRICS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bff-logs:/app/logs
    depends_on:
      backend-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  ***REMOVED*** Frontend - Next.js Web Application
  frontend:
    image: ${DOCKER_FRONTEND_IMAGE}
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      ***REMOVED*** Core Configuration
      - NODE_ENV=production

      ***REMOVED*** API Configuration
      ***REMOVED*** - NEXT_PUBLIC_API_URL=https://alexsandbox.me/api
      - NEXT_PUBLIC_BFF_API_URL=https://alexsandbox.me/api
    depends_on:
      bff-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'node.*server.js' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  ***REMOVED*** Data Importer - Utility service for data synchronization
  data-importer:
    image: ${DOCKER_IMPORTER_IMAGE}
    container_name: data-importer
    restart: "no" ***REMOVED*** Run once or manually triggered
    profiles: ["sync", "import"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      ***REMOVED*** Database Configuration
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
      ***REMOVED*** API Keys
      - TMDB_ACCESS_TOKEN=${TMDB_ACCESS_TOKEN}
      - OMDB_API_KEY=${OMDB_API_KEY}
      ***REMOVED*** Import Configuration
      - BATCH_SIZE=100
      - RATE_LIMIT_DELAY=1
      - MAX_RETRIES=3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - importer-logs:/app/logs
    depends_on:
      backend-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

***REMOVED*** Named volumes for persistent logs
volumes:
  backend-logs:
    driver: local
  auth-logs:
    driver: local
  bff-logs:
    driver: local
  importer-logs:
    driver: local

***REMOVED*** Networks (using default bridge network)
networks:
  default:
    driver: bridge
