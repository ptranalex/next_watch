services:
  # Prometheus - Metrics collection and alerting
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus-local
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--web.external-url=http://localhost:9090/"
      - "--web.route-prefix=/"
    ports:
      - "9090:9090"
    environment:
      - TZ=UTC
    volumes:
      - ./monitoring/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-local:/prometheus
    networks:
      - monitoring-local
      - next_watch_default
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana-local
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SERVER_ROOT_URL=http://localhost:3001/
      - GF_SECURITY_SECRET_KEY=local-secret-key
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_FEATURE_TOGGLES_ENABLE=ngalert
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - TZ=UTC
    volumes:
      - grafana-data-local:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring-local
      - next_watch_default
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AlertManager - Alert routing and notification (simplified for local)
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager-local
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093/"
      - "--web.route-prefix=/"
      - "--cluster.listen-address=0.0.0.0:9094"
    ports:
      - "9093:9093"
    environment:
      - TZ=UTC
    volumes:
      - ./monitoring/alertmanager/alertmanager.local.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data-local:/alertmanager
    networks:
      - monitoring-local
      - next_watch_default
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - Host metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter-local
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.systemd"
      - "--collector.processes"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc/hostname:/etc/nodename:ro
    networks:
      - monitoring-local
      - next_watch_default
    pid: host
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor-local
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-local
      - next_watch_default
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--disable_metrics=advtcp,cpu_topology,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl,cpuset,memory_numa"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: loki-local
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - TZ=UTC
    volumes:
      - ./monitoring/loki/loki.local.yml:/etc/loki/local-config.yaml
      - loki-data-local:/loki
    networks:
      - monitoring-local
      - next_watch_default
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail - Log shipping to Loki
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail-local
    restart: unless-stopped
    user: root
    volumes:
      - ./monitoring/promtail/promtail.local.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Mount the correct NextWatch service log volumes (if they exist)
      - next_watch_backend-logs:/app/logs/backend:ro
      - next_watch_bff-logs:/app/logs/bff:ro
      - next_watch_auth-logs:/app/logs/auth:ro
      - next_watch_search-logs:/app/logs/search:ro
      - next_watch_recommendation-logs:/app/logs/recommendation:ro
      - next_watch_ml-logs:/app/logs/ml:ro
    networks:
      - monitoring-local
      - next_watch_default
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Blackbox Exporter - Health endpoint monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter-local
    restart: unless-stopped
    ports:
      - "9115:9115"
    environment:
      - TZ=UTC
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - monitoring-local
      - next_watch_default
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
      - "--web.listen-address=:9115"
      - "--log.level=info"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9115/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Tempo - Distributed Tracing
  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo-local
    restart: unless-stopped
    user: root
    command:
      - "-config.file=/etc/tempo.yaml"
      - "-log.level=info"
    ports:
      - "3200:3200" # HTTP API
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "9411:9411" # Zipkin receiver
      - "14268:14268" # Jaeger HTTP receiver
    environment:
      - TZ=UTC
    volumes:
      - ./monitoring/tempo/tempo.local.yml:/etc/tempo.yaml
      - tempo-data-local:/tmp/tempo
    networks:
      - monitoring-local
      - next_watch_default
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3200/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prometheus-data-local:
    driver: local
  grafana-data-local:
    driver: local
  alertmanager-data-local:
    driver: local
  loki-data-local:
    driver: local
  tempo-data-local:
    driver: local
  # Use existing NextWatch log volumes (external, optional for local)
  next_watch_backend-logs:
    external: true
    name: next_watch_backend-logs
  next_watch_bff-logs:
    external: true
    name: next_watch_bff-logs
  next_watch_auth-logs:
    external: true
    name: next_watch_auth-logs
  next_watch_search-logs:
    external: true
    name: next_watch_search-logs
  next_watch_recommendation-logs:
    external: true
    name: next_watch_recommendation-logs
  next_watch_ml-logs:
    external: true
    name: next_watch_ml-logs

networks:
  monitoring-local:
    driver: bridge
    name: monitoring-local
  next_watch_default:
    external: true
    name: next_watch_default
